<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23276749'/%3E%3Crect x='10' y='10' width='100' height='100' rx='8' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='60' cy='60' r='22' fill='none' stroke='white' stroke-width='4'/%3E%3Cline x1='60' y1='10' x2='60' y2='110' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23276749'/%3E%3Crect x='12' y='12' width='96' height='96' rx='6' fill='none' stroke='white' stroke-width='5'/%3E%3Ccircle cx='60' cy='60' r='20' fill='none' stroke='white' stroke-width='5'/%3E%3Cline x1='60' y1='12' x2='60' y2='108' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E6%95%99%E7%B7%B4%E6%88%B0%E8%A1%93%E6%9D%BF%22%2C%22short_name%22%3A%22%E6%88%B0%E8%A1%93%E6%9D%BF%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22landscape%22%2C%22background_color%22%3A%22%231f2937%22%2C%22theme_color%22%3A%22%231f2937%22%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overscroll-behavior: none;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            /* 支援 iOS 全螢幕安全區域 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* 戰術板外層視窗：負責裁切與雙指縮放平移容器 */
        .pitch-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        
        /*
         * FIFA 標準 11 人制球場比例校正：
         * 標準長度 105m × 寬度 68m -> 長寬比 105 / 68 ≈ 1.5441 : 1
         */
        .pitch-container {
            position: relative;
            width: 100%;
            aspect-ratio: 105 / 68;
            background: repeating-linear-gradient(90deg, #2f855a, #2f855a 10%, #276749 10%, #276749 20%);
            border: 4px solid white;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
            touch-action: none;
            transform-origin: center center;
            will-change: transform;
        }

        .line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.85);
            pointer-events: none; 
        }
        /* 中線 */
        .half-way-line { top: 0; bottom: 0; left: 50%; transform: translateX(-50%); border-left: 2px solid rgba(255, 255, 255, 0.85); border-top: none; border-bottom: none; border-right: none; }
        /* 中圈：半徑 9.15m (直徑 18.3m) / 105m = 17.43% */
        .center-circle { top: 50%; left: 50%; width: 17.43%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; }
        .center-spot { top: 50%; left: 50%; width: 0.9%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); background-color: rgba(255, 255, 255, 0.9); border-radius: 50%; border: none; }

        /*
         * 大禁區 (Penalty Area)：
         * 深度 16.5m / 105m = 15.71%
         * 寬度 40.32m / 68m = 59.29% -> 上下邊距各 (100% - 59.29%) / 2 = 20.35%
         */
        .penalty-box-left { top: 20.35%; bottom: 20.35%; left: 0; width: 15.71%; border-left: none; }
        .penalty-box-right { top: 20.35%; bottom: 20.35%; right: 0; width: 15.71%; border-right: none; }

        /*
         * 小禁區 / 球門區 (Goal Area)：
         * 深度 5.5m / 105m = 5.24%
         * 寬度 18.32m / 68m = 26.94% -> 上下邊距各 (100% - 26.94%) / 2 = 36.53%
         */
        .goal-box-left { top: 36.53%; bottom: 36.53%; left: 0; width: 5.24%; border-left: none; }
        .goal-box-right { top: 36.53%; bottom: 36.53%; right: 0; width: 5.24%; border-right: none; }

        /*
         * 12 碼罰球點 (Penalty Spot)：
         * 距離球門線 11m / 105m = 10.48%
         */
        .penalty-spot-left { top: 50%; left: 10.48%; width: 0.8%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); background-color: rgba(255, 255, 255, 0.9); border-radius: 50%; border: none; }
        .penalty-spot-right { top: 50%; right: 10.48%; width: 0.8%; aspect-ratio: 1 / 1; transform: translate(50%, -50%); background-color: rgba(255, 255, 255, 0.9); border-radius: 50%; border: none; }

        /*
         * 球門 (Goal)：
         * 11 人制標準寬度 7.32m / 68m = 10.76% -> 上下邊距各 (100% - 10.76%) / 2 = 44.62%
         */
        .goal-left { top: 44.62%; bottom: 44.62%; left: 0; width: 1.3%; border-left: none; border-color: #fde047; border-width: 3px; background: rgba(255,255,255,0.24); }
        .goal-right { top: 44.62%; bottom: 44.62%; right: 0; width: 1.3%; border-right: none; border-color: #fde047; border-width: 3px; background: rgba(255,255,255,0.24); }

        /*
         * FIFA 五人制 (Futsal) 國際標準規格覆寫：
         * 球場長 40m × 寬 20m -> 長寬比 40 / 20 = 2 : 1
         * 球門寬 3.00m / 20m = 15.0% -> 上下邊距各 (100% - 15%) / 2 = 42.5%
         * 中圈半徑 3.00m (直徑 6.00m) / 40m = 15.0%
         * 隱藏 11 人制長方形大小禁區，改由 Canvas 繪製 FIFA 五人制 6m 弧形罰球區與 6m/10m 罰球點
         */
        .pitch-container.mode-5v5 {
            aspect-ratio: 40 / 20;
        }
        .pitch-container.mode-5v5 .center-circle {
            width: 15%;
        }
        .pitch-container.mode-5v5 .goal-left,
        .pitch-container.mode-5v5 .goal-right {
            top: 42.5%;
            bottom: 42.5%;
            width: 1.6%;
        }
        .pitch-container.mode-5v5 .penalty-box-left,
        .pitch-container.mode-5v5 .penalty-box-right,
        .pitch-container.mode-5v5 .goal-box-left,
        .pitch-container.mode-5v5 .goal-box-right,
        .pitch-container.mode-5v5 .penalty-spot-left,
        .pitch-container.mode-5v5 .penalty-spot-right {
            display: none;
        }

        .token {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: white;
            cursor: grab;
            user-select: none;
            touch-action: none; 
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            z-index: 20;
        }
        /* 擴大隱形觸控感應區，讓比例縮小的守門員在 iPad 上依然好拖拉 */
        .token::before {
            content: '';
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .token:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.12); z-index: 100; }
        .team-red { background: linear-gradient(135deg, #f56565, #c53030); border: 2px solid #fff; }
        .team-blue { background: linear-gradient(135deg, #4299e1, #2b6cb0); border: 2px solid #fff; }

        /*
         * 守門員 (GK) 真實比例設計：
         * - 11 人制：球門寬 7.32m (佔畫布高 10.76%)，真人守門員雙臂約 1.7m (約佔球門寬度 23%) -> 17px
         * - 5 人制 (Futsal)：球門寬僅 3.00m (佔畫布高 15%)，真人守門員雙臂展開/十字封堵約 1.65m (佔球門寬度 55%) -> 28px 搭配臂展外環
         */
        .gk-token {
            width: 17px;
            height: 17px;
            font-size: 9px;
            border-width: 1.5px;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.35), 0 3px 5px rgba(0, 0, 0, 0.5);
        }
        .pitch-container.mode-5v5 .gk-token {
            width: 28px;
            height: 28px;
            font-size: 12px;
            border-width: 2px;
            box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.42), 0 4px 6px rgba(0, 0, 0, 0.5);
        }
        .pitch-container.mode-5v5 .token:not(.gk-token):not(.ball-token) {
            width: 30px;
            height: 30px;
            font-size: 13px;
        }
        .gk-token.team-red {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            border-color: #fef08a;
        }
        .gk-token.team-blue {
            background: linear-gradient(135deg, #10b981, #047857);
            border-color: #a7f3d0;
        }

        .ball-token {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 24px;
            z-index: 30;
        }

        .name-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 1px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            font-weight: normal;
        }

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            touch-action: none;
        }

        /* 畫筆顏色按鈕選中狀態 */
        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .color-swatch.active {
            transform: scale(1.2);
            box-shadow: 0 0 0 3px #2563eb;
        }

        @media (max-width: 600px) {
            .token { width: 24px; height: 24px; font-size: 11px; }
            .gk-token { width: 13px; height: 13px; font-size: 8px; }
            .ball-token { font-size: 20px; }
            .name-label { font-size: 9px; bottom: -16px; }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen h-screen flex flex-col overflow-hidden">

    <!-- 頂部控制列 -->
    <header class="bg-white shadow-md px-3 py-2.5 md:px-4 md:py-3 flex flex-wrap gap-2.5 items-center justify-between z-50 shrink-0">

            <!-- 縮放控制 (支援雙指縮放與按鈕微調) -->

    <!-- 戰術板主區域 (支援雙指縮放與平移) -->

            </button>

                🗑️ 清除步驟

        </div>
    </footer>

    <!-- 姓名輸入 Modal -->
    <div id="name-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-4">編輯球員姓名</h2>
            <input type="text" id="name-input" class="w-full border-2 border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:border-blue-500" placeholder="請輸入姓名" />

            </div>

    <!-- Firebase 與戰術板邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tactics-board-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // =======================
        // localStorage 本機自動儲存 Key
        // =======================
        const LS_NAMES_KEY = 'wufonglee_tactics_player_names_v1';
        const LS_BOARD_STATE_KEY = 'wufonglee_tactics_board_state_v1';

        let db, auth;
        let playerNames = {};

        // 啟動時先從本機 localStorage 載入球員姓名
        try {
            const savedNames = localStorage.getItem(LS_NAMES_KEY);
            if (savedNames) playerNames = JSON.parse(savedNames);
        } catch (e) { console.warn("Failed to read names from localStorage:", e); }

        if (Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            const initAuth = async () => {
                try {
                    if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                    else await signInAnonymously(auth);
                    setupFirestoreListener();
                } catch (e) { console.warn("Auth failed:", e); }
            };
            initAuth();
        }

        function setupFirestoreListener() {
            if (!auth.currentUser) return;

            onSnapshot(namesRef, (docSnap) => {
                if (docSnap.exists()) {
                    playerNames = { ...playerNames, ...docSnap.data() };
                    localStorage.setItem(LS_NAMES_KEY, JSON.stringify(playerNames));
                    updateAllTokensText();
                }
            }, (err) => console.warn("Firestore error:", err));
        }

        }

        // =======================
        // 核心狀態與 FIFA 標準比例常數
        // =======================
        const pitchViewport = document.getElementById('pitch-viewport');
        const pitch = document.getElementById('pitch');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const tokensLayer = document.getElementById('tokens-layer');

        let currentMode = '11v11';
        let interactionMode = 'move'; // 'move', 'draw-line', 'draw-solid', 'draw-dashed'
        let currentPenColor = '#ffffff';
        let fovActive = false;
        let arrows = [];
        let ballState = { pos: [50, 50], el: null };

        // 雙指縮放與平移狀態
        let boardScale = 1;
        let boardTranslate = { x: 0, y: 0 };
        const MIN_SCALE = 0.75;
        const MAX_SCALE = 2.8;

        // 取得當前賽制對應的 FIFA 標準球門上下門柱 Y 軸百分比：
        // - 11 人制：球門寬 7.32m / 球場寬 68m = 10.76% -> 44.62% ~ 55.38%
        // - 5 人制 (Futsal)：球門寬 3.00m / 球場寬 20m = 15.00% -> 42.50% ~ 57.50%
        function getGoalPostBoundsPct() {
            if (currentMode === '5v5') {
                return { top: 42.5, bottom: 57.5 };
            }
            return { top: 44.62, bottom: 55.38 };
        }

        const formations = {
            '11v11': {
                red: [ { id: 'r1', num: 1, pos: [2.2, 50], isGK: true }, { id: 'r2', num: 2, pos: [20, 20] }, { id: 'r3', num: 3, pos: [20, 40] }, { id: 'r4', num: 4, pos: [20, 60] }, { id: 'r5', num: 5, pos: [20, 80] }, { id: 'r6', num: 6, pos: [35, 20] }, { id: 'r7', num: 7, pos: [35, 40] }, { id: 'r8', num: 8, pos: [35, 60] }, { id: 'r9', num: 9, pos: [35, 80] }, { id: 'r10', num: 10, pos: [45, 35] }, { id: 'r11', num: 11, pos: [45, 65] } ],
                blue: [ { id: 'b1', num: 1, pos: [97.8, 50], isGK: true }, { id: 'b2', num: 2, pos: [80, 20] }, { id: 'b3', num: 3, pos: [80, 40] }, { id: 'b4', num: 4, pos: [80, 60] }, { id: 'b5', num: 5, pos: [80, 80] }, { id: 'b6', num: 6, pos: [65, 20] }, { id: 'b7', num: 7, pos: [65, 40] }, { id: 'b8', num: 8, pos: [65, 60] }, { id: 'b9', num: 9, pos: [65, 80] }, { id: 'b10', num: 10, pos: [55, 35] }, { id: 'b11', num: 11, pos: [55, 65] } ]

            '5v5': {

        // 儲存與讀取整個戰術板狀態至 localStorage
        function saveBoardStateToLocal() {
            try {
                const positions = {};
                document.querySelectorAll('.token').forEach(el => {
                    positions[el.dataset.id] = [
                        parseFloat(el.style.left),

                    ];

        function loadBoardStateFromLocal() {
            try {
                const raw = localStorage.getItem(LS_BOARD_STATE_KEY);

        // =======================
        // 雙指縮放與平移視覺更新
        // =======================
        function applyBoardTransform() {
            // 限制平移範圍，避免把戰術板拖出畫面外
            const maxOffsetX = (pitch.clientWidth * boardScale) * 0.45;
            const maxOffsetY = (pitch.clientHeight * boardScale) * 0.45;
            boardTranslate.x = Math.max(-maxOffsetX, Math.min(maxOffsetX, boardTranslate.x));
            boardTranslate.y = Math.max(-maxOffsetY, Math.min(maxOffsetY, boardTranslate.y));

            pitch.style.transform = `translate3d(${boardTranslate.x}px, ${boardTranslate.y}px, 0) scale(${boardScale})`;
            document.getElementById('btn-zoom-reset').innerText = `${Math.round(boardScale * 100)}%`;
        }

        function setZoom(newScale, centerX = null, centerY = null) {
            const prevScale = boardScale;
            boardScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

            if (centerX !== null && centerY !== null && prevScale !== boardScale) {
                const rect = pitch.getBoundingClientRect();
                const pitchCenterX = rect.left + rect.width / 2;
                const pitchCenterY = rect.top + rect.height / 2;
                const ratio = boardScale / prevScale;
                boardTranslate.x -= (centerX - pitchCenterX) * (ratio - 1);
                boardTranslate.y -= (centerY - pitchCenterY) * (ratio - 1);
            }
            if (Math.abs(boardScale - 1) < 0.03) {
                boardScale = 1;
                boardTranslate = { x: 0, y: 0 };
            }
            applyBoardTransform();
        }

        // =======================
        // devicePixelRatio 1:1 畫布校正 (相容任意縮放倍率)
        // =======================
        let canvasLogicalWidth = 0;
        let canvasLogicalHeight = 0;

        function resizeCanvas() {
            const dpr = (window.devicePixelRatio || 1) * 1.25; // 提升縮放時的清晰度
            const width = pitch.clientWidth;
            const height = pitch.clientHeight;

            canvasLogicalWidth = width;
            canvasLogicalHeight = height;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            renderCanvas();
        }

        // 將觸控或滑鼠座標轉為精準畫布百分比與內部邏輯像素 (自動抵消 scale 縮放影響)
        function getPointerPos(e) {
            const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
            const rect = canvas.getBoundingClientRect();
            const xPct = Math.max(0, Math.min(100, ((touch.clientX - rect.left) / rect.width) * 100));
            const yPct = Math.max(0, Math.min(100, ((touch.clientY - rect.top) / rect.height) * 100));
            return {
                x: (xPct / 100) * canvasLogicalWidth,
                y: (yPct / 100) * canvasLogicalHeight,
                xPct,
                yPct
            };
        }

        function px(pct) { return (pct / 100) * canvasLogicalWidth; }
        function py(pct) { return (pct / 100) * canvasLogicalHeight; }

        // =======================
        // 繪製 FIFA 標準球場幾何標線 (11人制罰球弧 vs 5人制 6m 弧形罰球區與雙罰球點)
        // =======================
        function renderPitchPenaltyArcs() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2;

            if (currentMode === '11v11') {
                // 11 人制：12 碼點位於 11m / 105m = 10.48%，大禁區線位於 16.5m / 105m = 15.71%
                // 罰球弧半徑 R = 9.15m / 105m = 8.714% 的球場長度
                const arcRadiusPx = (9.15 / 105) * canvasLogicalWidth;
                const halfArcAngle = Math.acos(5.5 / 9.15);

                // 左禁區弧頂
                ctx.beginPath();
                ctx.arc(px(10.48), py(50), arcRadiusPx, -halfArcAngle, halfArcAngle, false);
                ctx.stroke();

                // 右禁區弧頂
                ctx.beginPath();
                ctx.arc(px(100 - 10.48), py(50), arcRadiusPx, Math.PI - halfArcAngle, Math.PI + halfArcAngle, false);
                ctx.stroke();
            } else {
                // FIFA 五人制 (Futsal 40m × 20m)：
                // 1. 6m 弧形罰球區：以兩根門柱外側 (Y = 42.5% 與 57.5%) 為圓心，半徑 6m (佔長 15%、佔寬 30%) 畫 1/4 圓弧，中間以直線連接
                const r6m = (6 / 40) * canvasLogicalWidth; // 在 2:1 畫布上 (6/40)*W === (6/20)*H
                const topPostY = py(42.5);
                const bottomPostY = py(57.5);

                // 左側 6m 弧形罰球區
                ctx.beginPath();
                ctx.arc(0, topPostY, r6m, -Math.PI / 2, 0, false);
                ctx.lineTo(r6m, bottomPostY);
                ctx.arc(0, bottomPostY, r6m, 0, Math.PI / 2, false);
                ctx.stroke();

                // 右側 6m 弧形罰球區
                const rightX = canvasLogicalWidth;
                ctx.beginPath();
                ctx.arc(rightX, topPostY, r6m, -Math.PI / 2, Math.PI, true);
                ctx.lineTo(rightX - r6m, bottomPostY);
                ctx.arc(rightX, bottomPostY, r6m, Math.PI, Math.PI / 2, true);
                ctx.stroke();

                // 2. 第一罰球點 (6m Penalty Mark，位於 X = 15% 與 85% 弧頂線上)
                const spotRadius = Math.max(3, canvasLogicalWidth * 0.004);
                [15, 85].forEach(xPct => {
                    ctx.beginPath();
                    ctx.arc(px(xPct), py(50), spotRadius, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 3. 第二罰球點 (10m Second Penalty Mark，位於 X = 25% 與 75%)
                [25, 75].forEach(xPct => {
                    ctx.beginPath();
                    ctx.arc(px(xPct), py(50), spotRadius * 0.9, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 4. 守門員 5m 防守距離標記線 (距離門線 5m -> X = 12.5% 與 87.5%)
                [12.5, 87.5].forEach(xPct => {
                    ctx.beginPath();
                    ctx.moveTo(px(xPct), py(49));
                    ctx.lineTo(px(xPct), py(51));
                    ctx.stroke();
                });

                // 5. 替補區邊線標記 (距離中線 5m~10m -> X = 37.5%, 25% 與 62.5%, 75%)
                [25, 37.5, 62.5, 75].forEach(xPct => {
                    ctx.beginPath();
                    ctx.moveTo(px(xPct), 0);
                    ctx.lineTo(px(xPct), py(2.2));
                    ctx.stroke();
                });
            }

            ctx.restore();
        }

        // =======================
        // 三角函數射門視角 + 防守球員遮擋陰影計算
        // =======================
        function mergeIntervals(intervals) {
            if (intervals.length === 0) return [];
            const sorted = [...intervals].sort((a, b) => a[0] - b[0]);
            const merged = [sorted[0]];
            for (let i = 1; i < sorted.length; i++) {
                const prev = merged[merged.length - 1];
                const curr = sorted[i];
                if (curr[0] <= prev[1]) {
                    prev[1] = Math.max(prev[1], curr[1]);
                } else {
                    merged.push(curr);
                }
            }
            return merged;
        }

        function renderDefensiveFOV() {
            if (!fovActive || !ballState.el) return;

            const bx = px(ballState.pos[0]);
            const by = py(ballState.pos[1]);

            const isLeftGoal = ballState.pos[0] < 50;
            const goalX = isLeftGoal ? 0 : canvasLogicalWidth;
            const goalBounds = getGoalPostBoundsPct();
            const postTopY = py(goalBounds.top);
            const postBottomY = py(goalBounds.bottom);
            const goalHeightPx = postBottomY - postTopY;

            const refDirX = isLeftGoal ? -1 : 1;
            function toLocalAngle(targetX, targetY) {
                const dx = (targetX - bx) * refDirX;
                const dy = targetY - by;
                return Math.atan2(dy, dx);
            }
            function localAngleToGlobal(localRad) {
                const dx = Math.cos(localRad) * refDirX;
                const dy = Math.sin(localRad);
                return Math.atan2(dy, dx);
            }
            function intersectGoalLineY(localRad) {
                const distToGoalX = Math.abs(goalX - bx);
                return by + distToGoalX * Math.tan(localRad);
            }

            const localA1 = toLocalAngle(goalX, postTopY);
            const localA2 = toLocalAngle(goalX, postBottomY);
            const coneMin = Math.min(localA1, localA2);
            const coneMax = Math.max(localA1, localA2);
            const totalShotAngleRad = Math.max(0, coneMax - coneMin);
            const totalShotAngleDeg = (totalShotAngleRad * 180 / Math.PI);

            const distTop = Math.hypot(goalX - bx, postTopY - by);
            const distBottom = Math.hypot(goalX - bx, postBottomY - by);

            ctx.save();

            // 1. 繪製基礎射門黃金三角扇形區
            const grad = ctx.createRadialGradient(bx, by, 5, bx, by, Math.max(distTop, distBottom));
            grad.addColorStop(0, 'rgba(250, 204, 21, 0.45)');
            grad.addColorStop(1, 'rgba(250, 204, 21, 0.16)');

            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(goalX, postTopY);
            ctx.lineTo(goalX, postBottomY);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = 'rgba(254, 240, 138, 0.85)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(goalX, postTopY);
            ctx.moveTo(bx, by);
            ctx.lineTo(goalX, postBottomY);
            ctx.stroke();

            // 2. 掃描場上所有球員，計算對球門造成的「遮擋陰影 (Blocking Shadow)」
            const blockedIntervals = [];
            const playerTokens = document.querySelectorAll('.token:not(.ball-token)');

            playerTokens.forEach(tokenEl => {
                const pxPct = parseFloat(tokenEl.style.left);
                const pyPct = parseFloat(tokenEl.style.top);
                const cx = px(pxPct);
                const cy = py(pyPct);
                const isGK = tokenEl.classList.contains('gk-token');

                const isBetweenBallAndGoal = isLeftGoal ? (cx < bx - 2) : (cx > bx + 2);
                if (!isBetweenBallAndGoal) return;

                // 依當前賽制 FIFA 球門與真人比例計算封堵半徑：
                // - 11 人制 (7.32m 球門)：守門員雙臂約 1.75m (佔球門 24% -> 半徑 0.12)，球員約 1.1m (佔球門 15% -> 半徑 0.08)
                // - 5 人制 (3.00m 球門)：守門員雙臂/十字步約 1.65m (佔球門 55% -> 半徑 0.275)，球員約 1.05m (佔球門 35% -> 半徑 0.175)
                const blockRadius = currentMode === '5v5'
                    ? (isGK ? goalHeightPx * 0.275 : goalHeightPx * 0.175)
                    : (isGK ? goalHeightPx * 0.12 : goalHeightPx * 0.08);
                const distToPlayer = Math.hypot(cx - bx, cy - by);
                if (distToPlayer <= blockRadius + 1) return;

                const centerLocalAngle = toLocalAngle(cx, cy);
                const halfSpread = Math.asin(Math.min(0.98, blockRadius / distToPlayer));
                const pMin = centerLocalAngle - halfSpread;
                const pMax = centerLocalAngle + halfSpread;

                const clampedMin = Math.max(coneMin, pMin);
                const clampedMax = Math.min(coneMax, pMax);

                if (clampedMax > clampedMin) {
                    blockedIntervals.push([clampedMin, clampedMax]);

                    const tangentDist = Math.sqrt(distToPlayer * distToPlayer - blockRadius * blockRadius);
                    const gMin = localAngleToGlobal(clampedMin);
                    const gMax = localAngleToGlobal(clampedMax);

                    const startX1 = bx + Math.cos(gMin) * tangentDist;
                    const startY1 = by + Math.sin(gMin) * tangentDist;
                    const startX2 = bx + Math.cos(gMax) * tangentDist;
                    const startY2 = by + Math.sin(gMax) * tangentDist;

                    const goalY1 = Math.max(postTopY, Math.min(postBottomY, intersectGoalLineY(clampedMin)));
                    const goalY2 = Math.max(postTopY, Math.min(postBottomY, intersectGoalLineY(clampedMax)));

                    ctx.setLineDash([]);
                    ctx.fillStyle = isGK ? 'rgba(239, 68, 68, 0.48)' : 'rgba(15, 23, 42, 0.52)';
                    ctx.beginPath();
                    ctx.moveTo(startX1, startY1);
                    ctx.lineTo(goalX, goalY1);
                    ctx.lineTo(goalX, goalY2);
                    ctx.lineTo(startX2, startY2);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = isGK ? 'rgba(252, 165, 165, 0.85)' : 'rgba(148, 163, 184, 0.75)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(startX1, startY1);
                    ctx.lineTo(goalX, goalY1);
                    ctx.moveTo(startX2, startY2);
                    ctx.lineTo(goalX, goalY2);
                    ctx.stroke();

                    ctx.setLineDash([]);
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(goalX, goalY1);
                    ctx.lineTo(goalX, goalY2);
                    ctx.stroke();

                    ctx.strokeStyle = isGK ? '#fde047' : 'rgba(255,255,255,0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, blockRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });

            // 3. 繪製最佳防守角平分線 (Bisector)
            const bisectorLocal = (coneMin + coneMax) / 2;
            const bisectorY = intersectGoalLineY(bisectorLocal);
            ctx.strokeStyle = 'rgba(248, 113, 113, 0.85)';
            ctx.lineWidth = 1.8;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(goalX, bisectorY);
            ctx.stroke();

            // 4. 合併計算「被遮擋角度」與「剩餘有效射門角度」
            const merged = mergeIntervals(blockedIntervals);
            let blockedRad = 0;
            merged.forEach(([a, b]) => { blockedRad += (b - a); });
            const openRad = Math.max(0, totalShotAngleRad - blockedRad);
            const openDeg = (openRad * 180 / Math.PI).toFixed(1);
            const blockedPct = totalShotAngleRad > 1e-4 ? Math.round((blockedRad / totalShotAngleRad) * 100) : 0;

            // 5. 繪製射門角弧與數據資訊面板（資訊面板置於視角反方向，完全不擋視角）
            const arcRadius = Math.min(54, Math.min(distTop, distBottom) * 0.32);
            if (arcRadius > 14) {
                const gConeMin = localAngleToGlobal(coneMin);
                const gConeMax = localAngleToGlobal(coneMax);
                ctx.setLineDash([]);
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(bx, by, arcRadius, gConeMin, gConeMax, isLeftGoal);
                ctx.stroke();
            }

            const gBisect = localAngleToGlobal(bisectorLocal);
            // 將數據面板放在射門視角的「反方向（另一側）」，完全不遮擋射門視角與防守球員
            const oppositeAngle = gBisect + Math.PI;
            const labelDist = 64;
            const labelX = Math.max(75, Math.min(canvasLogicalWidth - 75, bx + Math.cos(oppositeAngle) * labelDist));
            const labelY = Math.max(26, Math.min(canvasLogicalHeight - 26, by + Math.sin(oppositeAngle) * labelDist));

            const line1 = `有效空檔: ${openDeg}° / 總角 ${totalShotAngleDeg.toFixed(1)}°`;
            const line2 = `防守封堵率: ${blockedPct}%`;

            ctx.font = 'bold 11px Inter, sans-serif';
            const boxW = Math.max(ctx.measureText(line1).width, ctx.measureText(line2).width) + 14;
            const boxH = 34;

            // 繪製球到反方向資訊框的微細連接引線
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(bx + Math.cos(oppositeAngle) * 14, by + Math.sin(oppositeAngle) * 14);
            ctx.lineTo(labelX, labelY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.beginPath();
            ctx.roundRect(labelX - boxW / 2, labelY - boxH / 2, boxW, boxH, 6);
            ctx.fill();
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.6)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fde047';
            ctx.fillText(line1, labelX, labelY - 7);
            ctx.fillStyle = blockedPct > 50 ? '#f87171' : '#a7f3d0';
            ctx.fillText(line2, labelX, labelY + 8);

            ctx.restore();
        }

        // =======================
        // 自由曲線與 Math.atan2 即時箭頭繪製
        // =======================
        function drawFreehandArrow(arr) {
            const pts = arr.points;
            if (!pts || pts.length < 2) return;

            const pixelPts = pts.map(p => ({ x: px(p.x), y: py(p.y) }));
            const endPt = pixelPts[pixelPts.length - 1];

            let refPt = pixelPts[0];
            for (let i = pixelPts.length - 2; i >= 0; i--) {
                if (Math.hypot(endPt.x - pixelPts[i].x, endPt.y - pixelPts[i].y) >= 8) {
                    refPt = pixelPts[i];
                    break;
                }
            }

            const angle = Math.atan2(endPt.y - refPt.y, endPt.x - refPt.x);
            const headLength = 16;
            const headSpread = Math.PI / 6;
            const strokeColor = arr.color || '#ffffff';

            ctx.save();
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = strokeColor;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (arr.type === 'dashed') {
                ctx.setLineDash([10, 10]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.beginPath();
            ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
            for (let i = 1; i < pixelPts.length - 1; i++) {
                const midX = (pixelPts[i].x + pixelPts[i + 1].x) / 2;
                const midY = (pixelPts[i].y + pixelPts[i + 1].y) / 2;
                ctx.quadraticCurveTo(pixelPts[i].x, pixelPts[i].y, midX, midY);
            }

            if (arr.type === 'line') {
                ctx.lineTo(endPt.x, endPt.y);
                ctx.stroke();
            } else {
                const lineEndX = endPt.x - Math.cos(angle) * (headLength * 0.5);
                const lineEndY = endPt.y - Math.sin(angle) * (headLength * 0.5);
                ctx.lineTo(lineEndX, lineEndY);
                ctx.stroke();

                ctx.setLineDash([]);
                const leftWingX = endPt.x - headLength * Math.cos(angle - headSpread);
                const leftWingY = endPt.y - headLength * Math.sin(angle - headSpread);
                const rightWingX = endPt.x - headLength * Math.cos(angle + headSpread);
                const rightWingY = endPt.y - headLength * Math.sin(angle + headSpread);

                ctx.beginPath();
                ctx.moveTo(endPt.x, endPt.y);
                ctx.lineTo(leftWingX, leftWingY);
                ctx.lineTo(rightWingX, rightWingY);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        function renderCanvas() {
            if (!canvasLogicalWidth || !canvasLogicalHeight) return;
            ctx.clearRect(0, 0, canvasLogicalWidth, canvasLogicalHeight);

            renderPitchPenaltyArcs();
            renderDefensiveFOV();
            arrows.forEach(arr => drawFreehandArrow(arr));
        }

        new ResizeObserver(() => resizeCanvas()).observe(pitch);

        // =======================
        // 球員與球標記生成 (支援本機儲存還原)
        // =======================
        function initBoard(mode, savedPositions = null) {
            currentMode = mode;
            // 切換 FIFA 11人制 (105m×68m) 與 FIFA 五人制 (40m×20m) 球場外觀與球門比例
            pitch.classList.toggle('mode-5v5', mode === '5v5');
            tokensLayer.innerHTML = '';
            
            const data = formations[mode];
            data.red.forEach(p => {
                const pos = (savedPositions && savedPositions[p.id]) ? savedPositions[p.id] : p.pos;
                createToken({ ...p, currentPos: pos }, 'team-red');
            });
            data.blue.forEach(p => {
                const pos = (savedPositions && savedPositions[p.id]) ? savedPositions[p.id] : p.pos;
                createToken({ ...p, currentPos: pos }, 'team-blue');
            });
            
            const ballPos = (savedPositions && savedPositions['ball']) ? savedPositions['ball'] : [50, 50];
            ballState.pos = [...ballPos];
            ballState.el = createToken({ id: 'ball', num: '⚽', pos: [50, 50], currentPos: ballState.pos }, 'ball-token');
            
            updateTabUI();
            updateAllTokensText();
            updateModeUI();
            resizeCanvas();
        }

        function createToken(player, className) {
            const el = document.createElement('div');
            el.classList.add('token', className);
            if (player.isGK) {
                el.classList.add('gk-token');
                el.title = currentMode === '5v5'
                    ? '五人制守門員 (依 3.00m 球門與 1.65m 十字封堵比例縮放)'
                    : '11人制守門員 (依 7.32m 球門與真人臂展比例縮放)';
            }
            el.dataset.id = player.id;
            el.dataset.role = player.role || '';
            el.dataset.defaultX = player.pos[0];
            el.dataset.defaultY = player.pos[1];
            const initPos = player.currentPos || player.pos;
            el.style.left = `${initPos[0]}%`;
            el.style.top = `${initPos[1]}%`;
            el.style.pointerEvents = interactionMode === 'move' ? 'auto' : 'none';
            
            if (player.id === 'ball') {
                el.innerText = player.num;
            } else {
                const numSpan = document.createElement('span');
                numSpan.className = 'number';
                numSpan.innerText = player.num;
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name-label';
                nameSpan.innerText = '';
                
                el.appendChild(numSpan);
                el.appendChild(nameSpan);
            }
            
            tokensLayer.appendChild(el);
            addTokenInteractions(el, player.id);
            return el;
        }

        function updateAllTokensText() {
            document.querySelectorAll('.token').forEach(el => {
                const id = el.dataset.id;
                if (id === 'ball') return;
                const nameLabel = el.querySelector('.name-label');
                if (nameLabel) {
                    const customName = playerNames[id];
                    const defaultRole = currentMode === '5v5' ? (el.dataset.role || '') : '';
                    const displayText = customName || defaultRole;
                    nameLabel.innerText = displayText;
                    nameLabel.style.display = displayText ? 'block' : 'none';
                }
            });
        }

        // =======================
        // 單指拖曳/畫線 + 雙指縮放平移 (Pinch-to-Zoom & Pan)
        // =======================
        let activeElement = null;
        let activeType = null; // 'token' | 'drawing-arrow' | 'pinch-zoom'
        let currentDrawingArrow = null;
        let touchStartPos = { x: 0, y: 0 };
        let isDragging = false;

        // 雙指縮放專用狀態
        let pinchStartDist = 0;
        let pinchStartScale = 1;
        let pinchLastCenter = { x: 0, y: 0 };

        function getTwoFingerMetrics(touches) {
            const t1 = touches[0];
            const t2 = touches[1];
            return {
                dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
                centerX: (t1.clientX + t2.clientX) / 2,
                centerY: (t1.clientY + t2.clientY) / 2
            };
        }

        function startPinchGesture(touches) {
            // 若原本第一指剛觸發了畫線或點到球員，先取消該單指動作
            if (activeType === 'drawing-arrow' && currentDrawingArrow) {
                if (currentDrawingArrow.points.length <= 3) {
                    arrows.pop();
                    renderCanvas();
                }
                currentDrawingArrow = null;
            }
            if (activeType === 'token' && activeElement) {
                if (activeElement.dataset.id !== 'ball') activeElement.style.zIndex = '20';
                activeElement = null;
            }

            activeType = 'pinch-zoom';
            const metrics = getTwoFingerMetrics(touches);
            pinchStartDist = Math.max(10, metrics.dist);
            pinchStartScale = boardScale;
            pinchLastCenter = { x: metrics.centerX, y: metrics.centerY };
        }

        ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
            document.addEventListener(evt, e => e.preventDefault(), { passive: false });
        });

        function addTokenInteractions(el, id) {
            const startEvent = (e) => {
                if (e.touches && e.touches.length >= 2) {
                    if (e.cancelable) e.preventDefault();
                    startPinchGesture(e.touches);
                    return;
                }
                if (interactionMode !== 'move') return;
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();

                activeElement = el;
                activeType = 'token';
                const pos = getPointerPos(e);
                touchStartPos = { x: pos.x, y: pos.y };
                isDragging = false;
                el.style.transition = 'none';
                if (id !== 'ball') el.style.zIndex = '100';
            };
            el.addEventListener('mousedown', startEvent);
            el.addEventListener('touchstart', startEvent, { passive: false });
        }

        const pitchStartEvent = (e) => {
            if (e.cancelable) e.preventDefault();

            // 偵測到雙指觸控 -> 立即進入雙指縮放平移模式
            if (e.touches && e.touches.length >= 2) {
                startPinchGesture(e.touches);
                return;
            }

            if (!interactionMode.startsWith('draw')) return;

            const pos = getPointerPos(e);
            activeType = 'drawing-arrow';
            let lineType = 'solid';
            if (interactionMode === 'draw-dashed') lineType = 'dashed';
            else if (interactionMode === 'draw-line') lineType = 'line';

            currentDrawingArrow = {
                id: Date.now(),
                type: lineType,
                color: currentPenColor,
                points: [{ x: pos.xPct, y: pos.yPct }]
            };
            arrows.push(currentDrawingArrow);
            renderCanvas();
        };

        pitch.addEventListener('mousedown', pitchStartEvent);
        pitch.addEventListener('touchstart', pitchStartEvent, { passive: false });
        pitchViewport.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length >= 2) {
                if (e.cancelable) e.preventDefault();
                startPinchGesture(e.touches);
            }
        }, { passive: false });

        function handleGlobalMove(e) {
            // 若在移動過程中變成雙指，自動切換至雙指縮放
            if (e.touches && e.touches.length >= 2 && activeType !== 'pinch-zoom') {
                startPinchGesture(e.touches);
            }
            if (!activeType) return;
            if (e.cancelable) e.preventDefault();

            if (activeType === 'pinch-zoom' && e.touches && e.touches.length >= 2) {
                const metrics = getTwoFingerMetrics(e.touches);
                const newScale = pinchStartScale * (metrics.dist / pinchStartDist);
                boardScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

                // 同時支援雙指平移
                boardTranslate.x += (metrics.centerX - pinchLastCenter.x);
                boardTranslate.y += (metrics.centerY - pinchLastCenter.y);
                pinchLastCenter = { x: metrics.centerX, y: metrics.centerY };

                applyBoardTransform();
                return;
            }

            const pos = getPointerPos(e);

            if (activeType === 'token' && activeElement) {
                if (!isDragging && Math.hypot(pos.x - touchStartPos.x, pos.y - touchStartPos.y) > 5) {
                    isDragging = true;
                }
                activeElement.style.left = `${pos.xPct}%`;
                activeElement.style.top = `${pos.yPct}%`;
                if (activeElement.dataset.id === 'ball') {
                    ballState.pos = [pos.xPct, pos.yPct];
                }
                if (fovActive) renderCanvas();
            } else if (activeType === 'drawing-arrow' && currentDrawingArrow) {
                const pts = currentDrawingArrow.points;
                const lastPt = pts[pts.length - 1];
                const distPx = Math.hypot(px(pos.xPct) - px(lastPt.x), py(pos.yPct) - py(lastPt.y));
                if (distPx >= 3) {
                    pts.push({ x: pos.xPct, y: pos.yPct });
                    renderCanvas();
                }
            }
        }

        function handleGlobalEnd(e) {
            if (!activeType) return;

            // 若雙指縮放只放開一指，等待全部手指離開再結束狀態
            if (activeType === 'pinch-zoom') {
                if (!e.touches || e.touches.length === 0) {
                    activeType = null;
                }
                return;
            }

            if (e.type === 'touchend' && e.cancelable) e.preventDefault();

            if (activeType === 'token' && activeElement) {
                if (!isDragging && activeElement.dataset.id !== 'ball') {
                    openNameModal(activeElement.dataset.id);
                } else if (isDragging && keyframes.length === 0) {
                    preAnimSnapshot = null; // 手動移動球員後，以最新位置作為下次箭頭動畫的起點
                }
                if (activeElement.dataset.id !== 'ball') {
                    activeElement.style.zIndex = '20';
                }
                saveBoardStateToLocal();
            } else if (activeType === 'drawing-arrow' && currentDrawingArrow) {
                const pts = currentDrawingArrow.points;
                if (pts.length < 2) {
                    arrows.pop();
                } else {
                    const startPt = pts[0];
                    const endPt = pts[pts.length - 1];
                    const totalDist = Math.hypot(px(endPt.x) - px(startPt.x), py(endPt.y) - py(startPt.y));
                    if (totalDist < 8 && pts.length < 5) {
                        arrows.pop();
                    }
                }
                renderCanvas();
                saveBoardStateToLocal();
            }

            activeElement = null;
            activeType = null;
            currentDrawingArrow = null;
        }

        document.addEventListener('mousemove', handleGlobalMove);
        document.addEventListener('mouseup', handleGlobalEnd);
        document.addEventListener('touchmove', handleGlobalMove, { passive: false });
        document.addEventListener('touchend', handleGlobalEnd, { passive: false });
        document.addEventListener('touchcancel', handleGlobalEnd, { passive: false });

        // 支援電腦滑鼠滾輪縮放戰術板
        pitchViewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.12 : -0.12;
            setZoom(boardScale + delta, e.clientX, e.clientY);
        }, { passive: false });

        document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(boardScale + 0.2));
        document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(boardScale - 0.2));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => {
            boardScale = 1;
            boardTranslate = { x: 0, y: 0 };

        document.querySelectorAll('.color-swatch').forEach(btn => {

        // =======================
        // 名稱編輯 Modal 邏輯

        const nameModal = document.getElementById('name-modal');

        // =======================
        // 🎬 戰術動畫播放系統 (支援「手繪箭頭自動跑位」與「多步驟關鍵影格連續動畫」)
        // =======================
        let keyframes = []; // 每個元素為 { positions: { r1: [x,y], ... } }
        let isPlayingAnim = false;
        let animLoop = false;
        let animSpeed = 1.0; // 0.5x, 1.0x, 1.5x
        let animReqId = null;
        let preAnimSnapshot = null; // 保存按下播放前的原始站位，方便「回到起點」
        let activeKeyframeIdx = -1;

        const btnAddStep = document.getElementById('btn-add-step');
        const btnPlayAnim = document.getElementById('btn-play-anim');
        const btnRewindAnim = document.getElementById('btn-rewind-anim');
        const btnLoopAnim = document.getElementById('btn-loop-anim');
        const btnSpeedAnim = document.getElementById('btn-speed-anim');
        const btnClearSteps = document.getElementById('btn-clear-steps');
        const keyframesListEl = document.getElementById('keyframes-list');

        // 擷取目前場上所有球員與足球的百分比座標快照
        function capturePositionsSnapshot() {
            const snap = {};
            document.querySelectorAll('.token').forEach(el => {
                snap[el.dataset.id] = [
                    parseFloat(el.style.left),
                    parseFloat(el.style.top)
                ];
            });
            return snap;
        }

        // 將指定快照套用到場上所有球員與足球
        function applyPositionsSnapshot(snap, smooth = false) {
            if (!snap) return;
            document.querySelectorAll('.token').forEach(el => {
                const id = el.dataset.id;
                if (snap[id]) {
                    el.style.transition = smooth ? 'left 0.25s ease, top 0.25s ease' : 'none';
                    el.style.left = `${snap[id][0]}%`;
                    el.style.top = `${snap[id][1]}%`;
                    if (id === 'ball') {
                        ballState.pos = [snap[id][0], snap[id][1]];
                    }
                    if (smooth) {
                        setTimeout(() => { el.style.transition = 'none'; }, 260);
                    }
                }
            });
            renderCanvas();
        }

        // 平滑緩動函數 (Ease-In-Out Cubic)
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // 依弧長比例 (0 ~ 1) 在自由曲線軌跡 points 上等速取樣座標
        function samplePointAlongCurve(points, progress) {
            if (!points || points.length === 0) return [50, 50];
            if (points.length === 1 || progress <= 0) return [points[0].x, points[0].y];
            if (progress >= 1) return [points[points.length - 1].x, points[points.length - 1].y];

            // 計算累積弧長
            const cumLengths = [0];
            let totalLen = 0;
            for (let i = 1; i < points.length; i++) {
                const segLen = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
                totalLen += segLen;
                cumLengths.push(totalLen);
            }
            if (totalLen < 1e-4) return [points[0].x, points[0].y];

            const targetLen = progress * totalLen;
            for (let i = 1; i < cumLengths.length; i++) {
                if (cumLengths[i] >= targetLen) {
                    const prevLen = cumLengths[i - 1];
                    const segRatio = (targetLen - prevLen) / Math.max(1e-5, cumLengths[i] - prevLen);
                    const x = points[i - 1].x + (points[i].x - points[i - 1].x) * segRatio;
                    const y = points[i - 1].y + (points[i].y - points[i - 1].y) * segRatio;
                    return [x, y];
                }
            }
            return [points[points.length - 1].x, points[points.length - 1].y];
        }

        // 更新底部步驟列 UI
        function renderKeyframesUI() {
            keyframesListEl.innerHTML = '';
            if (keyframes.length === 0) {
                const hint = document.createElement('span');
                hint.className = 'text-xs text-gray-400';
                hint.innerText = '直接從球員/球畫箭頭即可按「播放」，或點「＋記錄步驟」建立連續分解動作';
                keyframesListEl.appendChild(hint);
                return;
            }

            keyframes.forEach((kf, idx) => {
                const badge = document.createElement('button');
                const isActive = idx === activeKeyframeIdx;
                badge.className = `px-2.5 py-1 rounded-md text-xs font-bold transition-all whitespace-nowrap ${
                    isActive
                        ? 'bg-emerald-500 text-white shadow ring-2 ring-emerald-300'
                        : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                }`;
                badge.innerText = `步驟 ${idx + 1}`;
                badge.title = `點擊切換預覽步驟 ${idx + 1}`;
                badge.addEventListener('click', () => {
                    stopTacticalAnimation();
                    activeKeyframeIdx = idx;
                    applyPositionsSnapshot(keyframes[idx].positions, true);
                    renderKeyframesUI();
                });
                keyframesListEl.appendChild(badge);
            });
        }

        function updatePlayButtonUI() {
            if (isPlayingAnim) {
                btnPlayAnim.innerHTML = '⏸ 暫停';
                btnPlayAnim.classList.replace('bg-emerald-600', 'bg-amber-500');
                btnPlayAnim.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-400');
            } else {
                btnPlayAnim.innerHTML = '▶ 播放戰術';
                btnPlayAnim.classList.replace('bg-amber-500', 'bg-emerald-600');
                btnPlayAnim.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-500');
            }
        }

        function stopTacticalAnimation() {
            if (animReqId) {
                cancelAnimationFrame(animReqId);
                animReqId = null;
            }
            isPlayingAnim = false;
            updatePlayButtonUI();
        }

        // 建立「手繪箭頭自動配對球員/球」的跑位任務清單
        function buildArrowAnimationTasks(startSnap) {
            const validArrows = arrows.filter(a => (a.type === 'solid' || a.type === 'dashed') && a.points && a.points.length >= 2);
            if (validArrows.length === 0) return [];

            const tasks = [];
            const assignedTokenIds = new Set();
            const SNAP_RADIUS_PCT = 12; // 箭頭起點半徑 12% 內自動吸附球員或足球

            // 先配對虛線箭頭 (優先配對給足球，代表傳球或射門路線)
            validArrows.forEach(arr => {
                const startPt = arr.points[0];
                if (arr.type === 'dashed' && startSnap['ball'] && !assignedTokenIds.has('ball')) {
                    const distBall = Math.hypot(startSnap['ball'][0] - startPt.x, startSnap['ball'][1] - startPt.y);
                    if (distBall <= SNAP_RADIUS_PCT * 1.25) {
                        assignedTokenIds.add('ball');
                        tasks.push({ tokenId: 'ball', points: arr.points });
                        return;
                    }
                }

                // 尋找距離該箭頭起點最近且尚未指派的球員或球
                let bestId = null;
                let bestDist = SNAP_RADIUS_PCT;
                Object.entries(startSnap).forEach(([id, pos]) => {
                    if (assignedTokenIds.has(id)) return;
                    const d = Math.hypot(pos[0] - startPt.x, pos[1] - startPt.y);
                    if (d <= bestDist) {
                        bestDist = d;
                        bestId = id;
                    }
                });

                if (bestId) {
                    assignedTokenIds.add(bestId);
                    tasks.push({ tokenId: bestId, points: arr.points });

                    // 若該球員腳下正好有球 (距離球 < 5%)，且球沒有獨立的傳球虛線，讓球跟著該球員一起盤帶移動！
                    if (bestId !== 'ball' && startSnap['ball'] && !assignedTokenIds.has('ball')) {
                        const distToBall = Math.hypot(startSnap[bestId][0] - startSnap['ball'][0], startSnap[bestId][1] - startSnap['ball'][1]);
                        const hasOtherBallArrow = validArrows.some(other =>
                            other !== arr &&
                            Math.hypot(startSnap['ball'][0] - other.points[0].x, startSnap['ball'][1] - other.points[0].y) <= SNAP_RADIUS_PCT
                        );
                        if (distToBall <= 5.5 && !hasOtherBallArrow) {
                            assignedTokenIds.add('ball');
                            tasks.push({
                                tokenId: 'ball',
                                points: arr.points.map(p => ({ x: p.x + 1.2, y: p.y + 1.2 }))
                            });
                        }
                    }
                }
            });

            return tasks;
        }

        function startTacticalAnimation() {
            // 若已有至少 2 個錄製步驟 -> 播放多步驟關鍵影格動畫
            if (keyframes.length >= 2) {
                if (!preAnimSnapshot) preAnimSnapshot = capturePositionsSnapshot();
                isPlayingAnim = true;
                updatePlayButtonUI();

                const segmentDurationMs = 1400 / animSpeed;
                const totalSegments = keyframes.length - 1;
                let currentSeg = 0;
                let segStartTime = performance.now();

                activeKeyframeIdx = 0;
                applyPositionsSnapshot(keyframes[0].positions, false);
                renderKeyframesUI();

                const stepLoop = (now) => {
                    if (!isPlayingAnim) return;
                    const elapsed = now - segStartTime;
                    const rawT = Math.min(1, elapsed / segmentDurationMs);
                    const easedT = easeInOutCubic(rawT);

                    const fromPos = keyframes[currentSeg].positions;
                    const toPos = keyframes[currentSeg + 1].positions;
                    const interpSnap = {};

                    Object.keys(fromPos).forEach(id => {
                        const [x1, y1] = fromPos[id];
                        const [x2, y2] = toPos[id] || [x1, y1];
                        interpSnap[id] = [
                            x1 + (x2 - x1) * easedT,
                            y1 + (y2 - y1) * easedT
                        ];
                    });

                    applyPositionsSnapshot(interpSnap, false);

                    if (rawT < 1) {
                        animReqId = requestAnimationFrame(stepLoop);
                    } else {
                        currentSeg++;
                        activeKeyframeIdx = currentSeg;
                        renderKeyframesUI();
                        if (currentSeg < totalSegments) {
                            segStartTime = performance.now();
                            animReqId = requestAnimationFrame(stepLoop);
                        } else if (animLoop) {
                            setTimeout(() => {
                                if (!isPlayingAnim) return;
                                currentSeg = 0;
                                activeKeyframeIdx = 0;
                                renderKeyframesUI();
                                segStartTime = performance.now();
                                animReqId = requestAnimationFrame(stepLoop);
                            }, 350);
                        } else {
                            stopTacticalAnimation();
                        }
                    }
                };

                animReqId = requestAnimationFrame(stepLoop);
                return;
            }

            // 若未錄製多步驟，改走「手繪箭頭自動跑位/傳球動畫」
            const baseSnap = preAnimSnapshot || capturePositionsSnapshot();
            const arrowTasks = buildArrowAnimationTasks(baseSnap);

            if (arrowTasks.length === 0) {
                // 閃爍提示使用者畫箭頭或記錄步驟
                keyframesListEl.innerHTML = '<span class="text-xs text-amber-300 font-semibold">💡 請先從球員或足球旁畫出「實線/虛線箭頭」，或移動球員後點「＋記錄步驟」（至少 2 步）即可播放動畫！</span>';
                return;
            }

            preAnimSnapshot = baseSnap;
            applyPositionsSnapshot(preAnimSnapshot, false);
            isPlayingAnim = true;
            updatePlayButtonUI();

            const durationMs = 1800 / animSpeed;
            let startTime = performance.now();

            const arrowAnimLoop = (now) => {
                if (!isPlayingAnim) return;
                const elapsed = now - startTime;
                const rawT = Math.min(1, elapsed / durationMs);
                const easedT = easeInOutCubic(rawT);

                const frameSnap = { ...preAnimSnapshot };
                arrowTasks.forEach(task => {
                    frameSnap[task.tokenId] = samplePointAlongCurve(task.points, easedT);
                });

                applyPositionsSnapshot(frameSnap, false);

                if (rawT < 1) {
                    animReqId = requestAnimationFrame(arrowAnimLoop);
                } else if (animLoop) {
                    setTimeout(() => {
                        if (!isPlayingAnim) return;
                        applyPositionsSnapshot(preAnimSnapshot, false);
                        startTime = performance.now();
                        animReqId = requestAnimationFrame(arrowAnimLoop);
                    }, 400);
                } else {
                    stopTacticalAnimation();
                }
            };

            animReqId = requestAnimationFrame(arrowAnimLoop);
        }

        // 綁定動畫控制列按鈕事件
        btnAddStep.addEventListener('click', () => {
            stopTacticalAnimation();
            const snap = capturePositionsSnapshot();
            if (keyframes.length === 0) {
                preAnimSnapshot = snap;
            }
            keyframes.push({ positions: snap });
            activeKeyframeIdx = keyframes.length - 1;
            renderKeyframesUI();
        });

        btnPlayAnim.addEventListener('click', () => {
            if (isPlayingAnim) {
                stopTacticalAnimation();
            } else {
                startTacticalAnimation();
            }
        });

        btnRewindAnim.addEventListener('click', () => {
            stopTacticalAnimation();
            if (keyframes.length > 0) {
                activeKeyframeIdx = 0;
                applyPositionsSnapshot(keyframes[0].positions, true);
                renderKeyframesUI();
            } else if (preAnimSnapshot) {
                applyPositionsSnapshot(preAnimSnapshot, true);
            }
        });

        btnLoopAnim.addEventListener('click', () => {
            animLoop = !animLoop;
            btnLoopAnim.innerText = animLoop ? '🔁 循環: 開' : '🔁 循環: 關';
            if (animLoop) {
                btnLoopAnim.classList.replace('bg-gray-700', 'bg-teal-600');
                btnLoopAnim.classList.replace('text-gray-300', 'text-white');
            } else {
                btnLoopAnim.classList.replace('bg-teal-600', 'bg-gray-700');
                btnLoopAnim.classList.replace('text-white', 'text-gray-300');
            }
        });

        const speedOptions = [0.5, 1.0, 1.5];
        btnSpeedAnim.addEventListener('click', () => {
            const idx = (speedOptions.indexOf(animSpeed) + 1) % speedOptions.length;
            animSpeed = speedOptions[idx];
            btnSpeedAnim.innerText = `${animSpeed.toFixed(1)}x`;
        });

        btnClearSteps.addEventListener('click', () => {
            stopTacticalAnimation();
            keyframes = [];
            activeKeyframeIdx = -1;
            preAnimSnapshot = null;
            renderKeyframesUI();
        });

        // 啟動時固定預設載入 11人制 ('11v11')
        initBoard('11v11');
    </script>
</body>
</html>
