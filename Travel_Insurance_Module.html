<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFA 旅平險動態報價系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; line-height: 1.6; margin: 0; }
        .container { max-width: 950px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 15px; font-size: 26px; font-weight: bold;}
        .status-bar { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 20px; padding: 8px; border-radius: 6px; }
        
        .tab-container { display: flex; margin-bottom: 25px; border-bottom: 2px solid #bdc3c7; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; cursor: pointer; color: #7f8c8d; background: #fdfefe; border: none; outline: none; transition: 0.3s; border-radius: 8px 8px 0 0; }
        .tab-btn:hover { background: #ebf5fb; color: #2980b9; }
        .tab-btn.active { background: #3498db; color: #fff; border-bottom: 2px solid #2980b9; }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 30%; background: #fdfefe; padding: 15px; border-radius: 8px; border: 1px solid #e5e8e8; transition: 0.3s;}
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 15px;}
        select, input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 16px; background-color: #fff; box-sizing: border-box;}
        
        button.action-btn { background-color: #3498db; color: #fff; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.3s; letter-spacing: 1px;}
        button.action-btn:hover { background-color: #2980b9; }
        button.action-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .result-box { margin-top: 30px; display: none; animation: fadeIn 0.5s;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .summary-card { background: #ebf5fb; border-left: 6px solid #2980b9; padding: 20px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;}
        .summary-title { font-size: 18px; color: #2c3e50; font-weight: bold; line-height: 1.5; }
        .highlight-premium { color: #c0392b; font-weight: 900; font-size: 32px; }

        .benefit-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .benefit-table th, .benefit-table td { padding: 12px 15px; text-align: left; border: 1px solid #ecf0f1; font-size: 16px; }
        .benefit-table th { background-color: #34495e; color: #fff; font-weight: bold; width: 60%; }
        .benefit-table tr:nth-child(even) { background-color: #f8f9f9; }
        .val-col { color: #d35400; font-weight: bold; text-align: right;}

        .multiplier-note { background: #fef9e7; border: 1px solid #f1c40f; border-left: 6px solid #f39c12; padding: 15px; border-radius: 6px; font-size: 15px; color: #856404; margin-bottom: 20px; line-height: 1.6;}
        
        @media screen and (max-width: 768px) {
            .form-group { min-width: 100%; }
            .summary-card { flex-direction: column; align-items: flex-start; }
            .tab-btn { font-size: 16px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ IFA 旅平險報價系統</h1>
    <div id="status_message" class="status-bar" style="background-color: #fcf3cf; color: #d35400;">⏳ 正在連線載入 rates.json 費率資料庫...</div>
    
    <div class="tab-container">
        <button class="tab-btn active" id="tab_life" onclick="switchTab('life')">南山人壽旅平險</button>
        <button class="tab-btn" id="tab_property" onclick="switchTab('property')">南山產物 (金平安 Pro6)</button>
    </div>

    <div class="form-row">
        <div class="form-group" id="dest_group">
            <label>旅遊目的地</label>
            <select id="destination" onchange="updateDynamicUI()">
                <option value="overseas" selected>國外旅遊</option>
                <option value="domestic">國內旅遊</option>
            </select>
        </div>

        <div class="form-group">
            <label>被保險人年齡</label>
            <select id="age_group" onchange="updateDynamicUI()">
                <option value="over_15" selected>滿 15 足歲 (含) 以上</option>
                <option value="under_15">未滿 15 足歲</option>
            </select>
        </div>

        <div class="form-group">
            <label id="days_label">旅遊天數</label>
            <input type="number" id="days" value="5" min="1" max="180" oninput="validateDays()">
        </div>
    </div>
    
    <div class="form-row" id="product_selection_row">
        <div class="form-group" style="flex: 2;">
            <label id="product_label">投保計畫組合</label>
            <select id="plan_select" onchange="updateAmountOptions()"></select>
        </div>
        
        <div class="form-group" id="amount_group" style="flex: 1;">
            <label id="amount_label">意外身故保額</label>
            <!-- 保額完全由 JSON 資料庫動態驅動生成 -->
            <select id="custom_amount"></select>
        </div>
    </div>

    <button id="calc_btn" class="action-btn" onclick="calculateTravel()" disabled>產出精確報價與保障總表</button>

    <div id="resultBox" class="result-box">
        <div class="summary-card">
            <div class="summary-title" id="summaryTitle"></div>
            <div style="text-align: right;">
                <span style="font-size: 16px; color: #7f8c8d;">表定精確總保費：</span><br>
                <span class="highlight-premium" id="totalPremium">0</span> <span style="font-size: 18px; color: #2c3e50; font-weight: bold;">元</span>
            </div>
        </div>

        <div class="multiplier-note" id="overseasNote" style="display:none;">
            💡 <strong>海外突發疾病限額放大機制：</strong><br>
            前往 <strong>美加、歐洲地區</strong> 調整係數為保額的 <strong>300%</strong>；<strong>日韓、紐澳地區</strong> 為 <strong>200%</strong>；其他地區為 100%。(下方表格顯示為基礎 100% 額度，實際理賠依發生地自動放大)
        </div>

        <table class="benefit-table" id="benefitTable">
        </table>
    </div>
</div>

<script>
    let currentTab = 'life';
    let globalRatesDB = {};

    // 產險端固定保障內容
    const property_benefits = {
        'p1': { name: '計畫一', death: '2,000萬', med: '100萬', ill_in: '100萬', inconv: '包含', liability: '500萬' },
        'p2': { name: '計畫二', death: '1,000萬', med: '100萬', ill_in: '100萬', inconv: '包含', liability: '300萬' },
        'p3': { name: '計畫三', death: '500萬', med: '50萬', ill_in: '50萬', inconv: '包含', liability: '300萬' },
        'p4': { name: '計畫四 (*限15-85歲)', death: '300萬', med: '10萬', ill_in: '10萬', inconv: '包含', liability: '100萬' },
        'xiaoA': { name: '小三通計畫A', death: '300萬', med: '20萬', ill_in: '20萬', inconv: '包含', liability: '100萬' },
        'p5': { name: '計畫五', death: '69萬', med: '20萬', ill_in: '20萬', inconv: '包含', liability: '100萬' },
        'p6': { name: '計畫六-童遊', death: '69萬', med: '10萬', ill_in: '10萬', inconv: '包含', liability: '100萬' },
        'xiaoB': { name: '小三通計畫B-童遊', death: '69萬', med: '10萬', ill_in: '10萬', inconv: '包含', liability: '100萬' }
    };

    // 險種對照表：ID 必須嚴格對齊您的 rates.json 最外層的 Key
    const product_mapping = {
        'domestic': {
            'over_15': [ { id: 'sta_smr', name: 'STA + SMR (國內優質首選)' }, { id: 'sta', name: 'STA (單獨投保)' } ],
            'under_15': [ { id: 'sta_smr', name: 'STA + SMR (國內優質首選)' }, { id: 'sta', name: 'STA (單獨投保)' } ]
        },
        'overseas': {
            'over_15': [
                { id: 'snsota', name: 'SNSOTA (海外最佳推薦)' },
                { id: 'aota', name: 'AOTA (海外旅行平安保險)' },
                { id: 'aota_aat', name: 'AOTA + AAT (含海外專機)' }
            ],
            'under_15': [
                { id: 'snsota', name: 'SNSOTA (海外最佳推薦)' },
                { id: 'aota', name: 'AOTA (未滿15足歲海外旅平險)' },
                { id: 'aota_aat', name: 'AOTA + AAT (含海外醫療專機)' }
            ]
        },
        'property': {
            'over_15': [
                { id: 'p1', name: property_benefits['p1'].name },
                { id: 'p2', name: property_benefits['p2'].name },
                { id: 'p3', name: property_benefits['p3'].name },
                { id: 'p4', name: property_benefits['p4'].name },
                { id: 'xiaoA', name: property_benefits['xiaoA'].name }
            ],
            'under_15': [
                { id: 'p5', name: property_benefits['p5'].name },
                { id: 'p6', name: property_benefits['p6'].name },
                { id: 'xiaoB', name: property_benefits['xiaoB'].name }
            ]
        }
    };

    window.onload = async function() {
        try {
            // 讀取外部資料庫 rates.json
            const response = await fetch('rates.json');
            if (!response.ok) throw new Error('Network response was not ok');
            globalRatesDB = await response.json();
            
            document.getElementById('status_message').innerText = "✅ 費率資料庫連線成功！全保額級距已載入。";
            document.getElementById('status_message').style.backgroundColor = "#d4efdf";
            document.getElementById('status_message').style.color = "#1e8449";
            document.getElementById('calc_btn').disabled = false;
            
            switchTab('life');
        } catch (error) {
            document.getElementById('status_message').innerText = "🚨 費率庫載入失敗！請確認 rates.json 檔案是否存在。";
            document.getElementById('status_message').style.backgroundColor = "#fadbd8";
            document.getElementById('status_message').style.color = "#c0392b";
        }
    };

    function switchTab(tabName) {
        currentTab = tabName;
        document.getElementById('tab_life').classList.remove('active');
        document.getElementById('tab_property').classList.remove('active');
        document.getElementById(`tab_${tabName}`).classList.add('active');

        const destGroup = document.getElementById('dest_group');
        const daysLabel = document.getElementById('days_label');
        const daysInput = document.getElementById('days');

        if (tabName === 'property') {
            destGroup.style.display = 'none'; 
            daysLabel.innerText = "旅遊天數 (產險 1~20 天)";
            daysInput.max = 20;
            if (parseInt(daysInput.value) > 20) daysInput.value = 20;
        } else {
            destGroup.style.display = 'block'; 
            daysLabel.innerText = "旅遊天數 (人壽 1~180 天)";
            daysInput.max = 180;
        }

        document.getElementById('resultBox').style.display = 'none';
        updateDynamicUI();
    }

    function validateDays() {
        const daysInput = document.getElementById('days');
        let maxDays = currentTab === 'property' ? 20 : 180;
        if (parseInt(daysInput.value) > maxDays) daysInput.value = maxDays;
    }

    function updateDynamicUI() {
        const dest = currentTab === 'property' ? 'property' : document.getElementById('destination').value;
        const ageGroup = document.getElementById('age_group').value;
        const planSelect = document.getElementById('plan_select');
        
        planSelect.innerHTML = '';
        let options = product_mapping[dest][ageGroup] || [];
        
        options.forEach(opt => {
            let optionElement = document.createElement('option');
            optionElement.value = opt.id;
            optionElement.text = opt.name;
            planSelect.appendChild(optionElement);
        });

        updateAmountOptions();
    }

    // 核心重構：讓保額選單完全根據 JSON 資料庫動態生長
    function updateAmountOptions() {
        const amountSelect = document.getElementById('custom_amount');
        amountSelect.innerHTML = '';
        const ageGroup = document.getElementById('age_group').value; // 'over_15' 或 'under_15'
        const planKey = document.getElementById('plan_select').value;

        if (currentTab === 'property') {
            let opt = document.createElement('option');
            opt.value = planKey;
            opt.text = property_benefits[planKey].death + " (依計畫固定)";
            amountSelect.appendChild(opt);
            return;
        }

        // 進入 JSON 尋找對應的 險種 -> 年齡層
        let targetData = globalRatesDB[planKey];
        if (!targetData) {
            amountSelect.innerHTML = '<option value="">無此險種資料</option>';
            return;
        }
        
        if (targetData[ageGroup]) {
            targetData = targetData[ageGroup];
        } else {
            amountSelect.innerHTML = '<option value="">該年齡層無資料</option>';
            return;
        }

        // 提取 JSON 中真實的保額陣列 Key，並由小到大排序
        let availableAmounts = Object.keys(targetData).map(Number).sort((a, b) => a - b);
        
        if(availableAmounts.length === 0) {
            amountSelect.innerHTML = '<option value="">無對應保額</option>';
            return;
        }

        availableAmounts.forEach(amt => {
            let opt = document.createElement('option');
            opt.value = amt; 
            opt.text = `${amt} 萬`;
            
            // 預設選項優化邏輯
            if (ageGroup === 'over_15' && amt === 1000) opt.selected = true; 
            if (ageGroup === 'under_15' && (amt === 69 || amt === 20)) opt.selected = true; 
            
            amountSelect.appendChild(opt);
        });
    }

    function calculateTravel() {
        const ageGroup = document.getElementById('age_group').value;
        const days = parseInt(document.getElementById('days').value);
        const planSelect = document.getElementById('plan_select');
        const planKey = planSelect.value;
        const planName = planSelect.options[planSelect.selectedIndex].text;
        
        if (!days || days < 1) {
            alert("請輸入有效的旅遊天數");
            return;
        }

        let premiumDisplay = 0;
        let tableHTML = "";

        if (currentTab === 'property') {
            // 讀取產險資料庫 (Pro6)
            let proData = globalRatesDB['pro6'];
            let ageFolder = ageGroup === 'over_15' ? 'adult' : 'child';
            
            if (proData && proData[ageFolder] && proData[ageFolder][planKey]) {
                const ratesArray = proData[ageFolder][planKey];
                premiumDisplay = days < ratesArray.length ? ratesArray[days].toLocaleString() : `(超出版載天數)`;
            } else {
                premiumDisplay = "(資料庫未建置此計畫)";
            }
            
            let b = property_benefits[planKey];
            tableHTML = `
                <tr><th>意外身故 / 失能保險金</th><td class="val-col">${b.death}</td></tr>
                <tr><th>傷害醫療保險金 (實支實付)</th><td class="val-col">${b.med}</td></tr>
                <tr><th>海外突發疾病醫療</th><td class="val-col">${b.ill_in}</td></tr>
                <tr><th>旅行不便險 (班機延誤/行李等)</th><td class="val-col" style="color:#2980b9;">${b.inconv}</td></tr>
                <tr><th>第三人責任保險</th><td class="val-col" style="color:#8e44ad;">${b.liability}</td></tr>
            `;
            document.getElementById('overseasNote').style.display = 'block';

        } else {
            // 讀取人壽資料庫
            const dest = document.getElementById('destination').value;
            const amountVal = document.getElementById('custom_amount').value;
            let targetData = globalRatesDB[planKey];
            
            if (targetData && targetData[ageGroup]) {
                targetData = targetData[ageGroup];
            }

            if (targetData && targetData[amountVal]) {
                const ratesArray = targetData[amountVal];
                premiumDisplay = days < ratesArray.length ? ratesArray[days].toLocaleString() : `(尚無 ${days} 天費率)`;
            } else {
                premiumDisplay = "(費率庫查無此保額)";
            }
            
            // 醫療保額常規為身故保額之 10%
            let medAmount = (parseFloat(amountVal) * 0.1).toFixed(0);
            // 幼童高額度特例顯示
            if(ageGroup === 'under_15' && amountVal == 69) medAmount = 20; 

            tableHTML = `
                <tr><th>意外身故 / 喪葬費用 / 失能保險金</th><td class="val-col">${amountVal} 萬</td></tr>
                <tr><th>傷害醫療保險金</th><td class="val-col">${medAmount} 萬</td></tr>
            `;

            if(dest === 'overseas') {
                tableHTML += `<tr><th>海外突發疾病醫療 (含住院/門診/急診)</th><td class="val-col">依保單條款限額</td></tr>`;
                if(planKey.includes('aat')) {
                    tableHTML += `<tr><th>海外醫療專機運送服務 (AAT)</th><td class="val-col" style="color:#8e44ad;">包含專機服務</td></tr>`;
                }
                document.getElementById('overseasNote').style.display = 'block';
            } else {
                document.getElementById('overseasNote').style.display = 'none';
            }
        }

        document.getElementById('summaryTitle').innerHTML = `
            ${currentTab === 'property' ? '🛡️ 南山產物 金平安Pro6' : '🏥 南山人壽 旅平險'} <br>
            <span style="font-size:15px; color:#7f8c8d; font-weight:normal;">
                被保險人：${ageGroup === 'over_15' ? '滿15足歲(含)以上' : '未滿15足歲'} | 行程：${days} 天
            </span><br>
            <span style="font-size:14px; color:#34495e;">所選組合：${planName}</span>
        `;
        
        document.getElementById('totalPremium').innerText = premiumDisplay;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
