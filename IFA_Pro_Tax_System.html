<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFA 資產傳承與稅務精算系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 15px; line-height: 1.6; margin: 0; }
        .container { max-width: 1050px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #8e44ad; padding-bottom: 10px; margin-bottom: 25px; font-size: 26px; font-weight: bold;}
        
        .tab-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { flex: 1; max-width: 300px; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; border: 2px solid #bdc3c7; background: #fdfefe; color: #7f8c8d; }
        .tab-btn.active { background: #8e44ad; color: #fff; border-color: #8e44ad; box-shadow: 0 4px 10px rgba(142,68,173,0.3); }
        
        .mode-section { display: none; animation: fadeIn 0.5s; }
        .mode-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 30%; background: #fdfefe; padding: 15px; border-radius: 8px; border: 1px solid #e5e8e8;}
        .form-group label { display: block; margin-bottom: 8px; color: #5a6a77; font-size: 16px; font-weight: bold;}
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 18px; color: #2c3e50; box-sizing: border-box; background-color:#fff;}
        .hint-text { font-size: 13px; color: #7f8c8d; margin-top: 5px; display: block; }

        button.action-btn { background-color: #d35400; color: #fff; padding: 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.3s; letter-spacing: 1px;}
        button.action-btn:hover { background-color: #a04000; }

        .result-box { margin-top: 30px; display: none; background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .result-title { font-size: 22px; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #2c3e50; font-weight: bold;}
        .status-light { width: 20px; height: 20px; border-radius: 50%; display: inline-block; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        
        .light-green { background-color: #2ecc71; }
        .light-red { background-color: #e74c3c; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .data-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 17px; }
        .data-table td { padding: 12px 5px; border-bottom: 1px solid #ecf0f1; color: #34495e;}
        .data-table tr:last-child td { border-bottom: none; }
        .val-col { text-align: right; font-weight: bold; color: #2c3e50;}
        
        .highlight-alert { color: #c0392b; font-size: 22px; font-weight: 900; }
        .highlight-safe { color: #27ae60; font-size: 22px; font-weight: 900; }
        .highlight-blue { color: #2980b9; font-size: 22px; font-weight: 900; }

        .advisor-note { background: #f8f9f9; border-left: 6px solid #8e44ad; padding: 20px; border-radius: 0 8px 8px 0; margin-top: 20px; }
        .advisor-note h4 { margin-top: 0; color: #8e44ad; font-size: 18px; margin-bottom: 10px; font-weight:bold;}
        .advisor-note p { margin: 0; font-size: 16px; color: #5a6a77; line-height: 1.6;}

        @media screen and (max-width: 768px) { 
            .form-group { min-width: 100%; }
            .tab-container { flex-direction: column; }
            .tab-btn { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 IFA 資產傳承與稅務精算系統</h1>

    <div class="tab-container">
        <div class="tab-btn active" id="btn-mode1" onclick="switchMode(1)">🔥 引擎一：遺產稅缺口警示</div>
        <div class="tab-btn" id="btn-mode2" onclick="switchMode(2)">💎 引擎二：免稅贈與極大化</div>
    </div>

    <!-- 引擎一：遺產稅缺口警示 -->
    <div id="mode1" class="mode-section active">
        <p style="font-size: 16px; color: #7f8c8d; margin-bottom: 20px; text-align: center;">輸入客戶概算之資產與家庭結構，系統將自動比對法規免稅額與累進稅率，精算「現金缺口」：</p>
        
        <!-- 第一列：資產輸入 -->
        <div class="form-row">
            <div class="form-group">
                <label>不動產總值 (公告現值估算)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="number" id="estate-real" value="8000" min="0"> 萬元
                </div>
            </div>
            <div class="form-group">
                <label>流動資產 (現金/存款/上市櫃股票)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="number" id="estate-liquid" value="1000" min="0"> 萬元
                </div>
            </div>
            <div class="form-group">
                <label>特種扣除額 (農地/公共設施保留地等)</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="number" id="estate-other" value="0" min="0"> 萬元
                </div>
                <span class="hint-text">若無特種免稅資產請填 0</span>
            </div>
        </div>

        <!-- 第二列：家庭結構動態免稅額 -->
        <div class="form-row">
            <div class="form-group">
                <label>被繼承人配偶狀況</label>
                <select id="estate-spouse">
                    <option value="553" selected>有配偶 (法定扣除額 553萬)</option>
                    <option value="0">無配偶</option>
                </select>
            </div>
            <div class="form-group">
                <label>直系血親卑親屬 (子女) 人數</label>
                <select id="estate-children">
                    <option value="0">0 位</option>
                    <option value="1">1 位</option>
                    <option value="2" selected>2 位 (每人扣除 56萬)</option>
                    <option value="3">3 位</option>
                    <option value="4">4 位</option>
                    <option value="5">5 位</option>
                </select>
            </div>
            <div class="form-group" style="background-color: #f4f6f7; border-color: #bdc3c7;">
                <label>📌 系統預設帶入法定額度</label>
                <div style="font-size: 15px; color: #34495e; margin-top: 10px; line-height: 1.8;">
                    ✓ 基本免稅額：1,333 萬<br>
                    ✓ 喪葬費扣除額：138 萬
                </div>
            </div>
        </div>

        <button class="action-btn" onclick="calcEstateTax()">執行遺產稅現金流壓力測試</button>
        
        <div id="result-mode1" class="result-box"></div>
    </div>

    <!-- 引擎二：免稅贈與極大化 -->
    <div id="mode2" class="mode-section">
        <p style="font-size: 16px; color: #7f8c8d; margin-bottom: 20px; text-align: center;">善用每年 244 萬免稅額，將高資產客戶的閒置資金轉化為巨額免稅傳承金庫：</p>
        
        <div class="form-row">
            <div class="form-group">
                <label>贈與人數量 (單人或雙親)</label>
                <select id="gift-parents">
                    <option value="1">單人贈與 (244萬/年)</option>
                    <option value="2" selected>雙親共同贈與 (488萬/年)</option>
                </select>
            </div>
            <div class="form-group">
                <label>預計投保/規劃年期</label>
                <select id="gift-term">
                    <option value="3">3 年期</option>
                    <option value="6" selected>6 年期</option>
                    <option value="10">10 年期</option>
                    <option value="20">20 年期</option>
                </select>
            </div>
            <div class="form-group">
                <label>預估保單槓桿倍數 (理賠額 ÷ 總保費)</label>
                <select id="gift-leverage">
                    <option value="1.5">1.5 倍 (保守儲蓄型)</option>
                    <option value="2.5" selected>2.5 倍 (高額壽險型)</option>
                    <option value="4.0">4.0 倍 (定期/長年期壽險)</option>
                </select>
            </div>
        </div>
        <button class="action-btn" style="background-color: #2980b9;" onclick="calcGiftStrategy()">生成免稅傳承槓桿報告</button>
        
        <div id="result-mode2" class="result-box"></div>
    </div>

</div>

<script>
    function switchMode(mode) {
        document.getElementById('btn-mode1').classList.remove('active');
        document.getElementById('btn-mode2').classList.remove('active');
        document.getElementById('mode1').classList.remove('active');
        document.getElementById('mode2').classList.remove('active');
        
        document.getElementById('result-mode1').style.display = 'none';
        document.getElementById('result-mode2').style.display = 'none';

        document.getElementById('btn-mode' + mode).classList.add('active');
        document.getElementById('mode' + mode).classList.add('active');
    }

    // 引擎一：遺產稅計算與缺口分析
    function calcEstateTax() {
        // 1. 資產總額
        const realEstate = parseFloat(document.getElementById('estate-real').value) || 0;
        const liquidAsset = parseFloat(document.getElementById('estate-liquid').value) || 0;
        const totalAsset = realEstate + liquidAsset;

        // 2. 免稅額與扣除額計算 (依 2024 年標準)
        const BASE_EXEMPTION = 1333;
        const FUNERAL_DEDUCT = 138;
        const spouseDeduct = parseFloat(document.getElementById('estate-spouse').value);
        const childrenCount = parseInt(document.getElementById('estate-children').value);
        const childrenDeduct = childrenCount * 56;
        const otherDeduct = parseFloat(document.getElementById('estate-other').value) || 0;

        const totalDeduct = BASE_EXEMPTION + spouseDeduct + childrenDeduct + FUNERAL_DEDUCT + otherDeduct;
        
        // 3. 課稅遺產淨額
        const netTaxable = Math.max(0, totalAsset - totalDeduct);
        
        // 4. 累進稅率計算
        let tax = 0;
        let taxBracket = "0%";
        if (netTaxable === 0) {
            tax = 0;
        } else if (netTaxable <= 5000) {
            tax = netTaxable * 0.1;
            taxBracket = "10%";
        } else if (netTaxable <= 10000) {
            tax = (netTaxable * 0.15) - 250;
            taxBracket = "15%";
        } else {
            tax = (netTaxable * 0.2) - 750;
            taxBracket = "20%";
        }

        // 5. 現金缺口比對
        const cashGap = liquidAsset - tax;
        
        const resultBox = document.getElementById('result-mode1');
        let lightClass, titleText, advisorText, gapHtml;

        if (cashGap < 0) {
            lightClass = 'light-red';
            titleText = '🚨 嚴重警示：現金缺口引爆法拍風險';
            gapHtml = `<td style="padding: 15px 0; color:#c0392b; font-weight:bold; font-size:18px;">⚠️ 遺產稅現金缺口：</td>
                       <td style="padding: 15px 0;" class="val-col highlight-alert">不足 ${Math.abs(cashGap).toLocaleString()} 萬</td>`;
            advisorText = `您的資產過度集中於不動產。當繼承發生時，家屬必須繳出現金 <strong>${tax.toLocaleString()} 萬</strong> 才能過戶。若現金不足，國稅局將強制拍賣遺產。<br><br>👉 <strong>解方：</strong>請立即規劃 <strong>${Math.abs(cashGap).toLocaleString()} 萬</strong> 以上的終身壽險。未來理賠金不僅免徵遺產稅，更能成為繳納稅金的「及時雨」，完美保全您的不動產版圖。`;
        } else {
            lightClass = 'light-green';
            titleText = '✅ 稅源安全：流動資產足以支付稅款';
            gapHtml = `<td style="padding: 15px 0; color:#27ae60; font-weight:bold; font-size:18px;">💰 繳稅後剩餘現金：</td>
                       <td style="padding: 15px 0;" class="val-col highlight-safe">結餘 ${cashGap.toLocaleString()} 萬</td>`;
            advisorText = `恭喜您，目前的現金流足以應付遺產稅。但請注意，繳完稅後家屬的現金水位將大幅下降。<br><br>👉 <strong>解方：</strong>既然有充足的現金，建議將部分資金轉入「美元終身壽險」，利用保險槓桿將資產放大 2~3 倍留給下一代，不僅抗通膨，還能透過「指定受益人」免除特留分的家族紛爭。`;
        }

        resultBox.style.borderColor = cashGap < 0 ? '#e74c3c' : '#2ecc71';
        resultBox.innerHTML = `
            <h3 class="result-title"><span class="status-light ${lightClass}"></span> ${titleText}</h3>
            <table class="data-table">
                <tr><td>預估遺產總額 (不動產+動產)：</td><td class="val-col">${totalAsset.toLocaleString()} 萬</td></tr>
                <tr>
                    <td style="color: #7f8c8d; font-size: 15px;">
                        ➖ 免稅額與扣除額總計：<br>
                        <span style="font-size: 13px; margin-left: 15px;">(含基本1333萬 + 配偶${spouseDeduct}萬 + 子女${childrenDeduct}萬 + 喪葬138萬 + 特種${otherDeduct}萬)</span>
                    </td>
                    <td class="val-col" style="color: #7f8c8d;">- ${totalDeduct.toLocaleString()} 萬</td>
                </tr>
                <tr><td>課稅遺產淨額：</td><td class="val-col">${netTaxable.toLocaleString()} 萬</td></tr>
                <tr><td>適用最高稅率級距：</td><td class="val-col">${taxBracket}</td></tr>
                <tr style="background:#f4f6f7;">
                    <td style="font-weight:bold;">應納遺產稅金 (必須以現金繳納)：</td>
                    <td class="val-col" style="color:#d35400; font-size:20px;">${tax.toLocaleString()} 萬</td>
                </tr>
                <tr><td>目前備有之流動現金：</td><td class="val-col">${liquidAsset.toLocaleString()} 萬</td></tr>
                <tr style="border-top: 2px solid #bdc3c7;">
                    ${gapHtml}
                </tr>
            </table>
            <div class="advisor-note">
                <h4>💡 IFA 架構師破局策略</h4>
                <p>${advisorText}</p>
            </div>
        `;
        resultBox.style.display = 'block';
    }

    // 引擎二：贈與極大化計算
    function calcGiftStrategy() {
        const parents = parseInt(document.getElementById('gift-parents').value);
        const term = parseInt(document.getElementById('gift-term').value);
        const leverage = parseFloat(document.getElementById('gift-leverage').value);

        const ANNUAL_EXEMPTION = 244; 
        const yearlyPremium = parents * ANNUAL_EXEMPTION;
        const totalPremium = yearlyPremium * term;
        const finalBenefit = Math.round(totalPremium * leverage);

        const resultBox = document.getElementById('result-mode2');
        resultBox.style.borderColor = '#2980b9';
        
        resultBox.innerHTML = `
            <h3 class="result-title" style="color:#2980b9;"><span class="status-light" style="background-color:#3498db;"></span> 💎 免稅資產轉移：最高效的傳承路徑</h3>
            <table class="data-table">
                <tr><td>每年合法免稅轉移資金：</td><td class="val-col">${yearlyPremium.toLocaleString()} 萬</td></tr>
                <tr><td>規劃總年期：</td><td class="val-col">${term} 年</td></tr>
                <tr style="background:#ebf5fb;">
                    <td style="font-weight:bold; color:#2980b9;">期滿總隱形轉移資產 (免繳贈與稅)：</td>
                    <td class="val-col highlight-blue">${totalPremium.toLocaleString()} 萬</td>
                </tr>
                <tr><td>預估保單槓桿放大效應：</td><td class="val-col">約 ${leverage} 倍</td></tr>
                <tr style="border-top: 2px solid #bdc3c7;">
                    <td style="padding: 15px 0; color:#8e44ad; font-weight:bold; font-size:18px;">🏆 子女最終實領免稅傳承金：</td>
                    <td style="padding: 15px 0; color:#8e44ad;" class="val-col highlight-safe">約 ${finalBenefit.toLocaleString()} 萬</td>
                </tr>
            </table>
            <div class="advisor-note" style="border-color:#2980b9;">
                <h4 style="color:#2980b9;">💡 IFA 架構師破局策略</h4>
                <p>我們不需與國稅局對抗，只需善用遊戲規則。<br><br>如果您將這 ${totalPremium.toLocaleString()} 萬留在銀行，未來依然是您的遺產，面臨 10%-20% 的稅。但如果您現在透過「子女當要/受益人，父母贈與保費」的架構，這 ${totalPremium.toLocaleString()} 萬不僅<strong>零贈與稅、零遺產稅</strong>，更透過壽險槓桿，為下一代創造了高達 <strong>${finalBenefit.toLocaleString()} 萬</strong> 的免稅資產！</p>
            </div>
        `;
        resultBox.style.display = 'block';
    }
</script>
</body>
</html>
