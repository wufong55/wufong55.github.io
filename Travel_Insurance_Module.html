<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅平險動態報價模組 (內建離線版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; line-height: 1.6; margin: 0; }
        .container { max-width: 950px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 25px; font-size: 26px; font-weight: bold;}
        
        .tab-container { display: flex; border-bottom: 2px solid #e5e8e8; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-size: 18px; font-weight: bold; background: none; border: none; color: #7f8c8d; cursor: pointer; transition: 0.3s; outline: none; }
        .tab-btn:hover { color: #3498db; }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; margin-bottom: -2px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 30%; background: #fdfefe; padding: 15px; border-radius: 8px; border: 1px solid #e5e8e8;}
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 15px;}
        select, input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 16px; background-color: #fff; box-sizing: border-box;}
        select:disabled, input:disabled { background-color: #f2f4f4; color: #7f8c8d; }
        
        button.action-btn { background-color: #3498db; color: #fff; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.3s;}
        button.action-btn:hover { background-color: #2980b9; }
        button.action-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .result-box { margin-top: 30px; display: none; background: #ebf5fb; border-left: 6px solid #2980b9; padding: 20px; border-radius: 8px;}
        .highlight-premium { color: #c0392b; font-weight: 900; font-size: 32px; }
        .status-bar { text-align: center; font-size: 14px; color: #e67e22; font-weight: bold; margin-bottom: 15px; }
        
        .coverage-list { margin-top: 15px; padding-top: 15px; border-top: 1px solid #bdc3c7; }
        .coverage-list h4 { color: #2c3e50; margin-bottom: 10px; font-size: 16px; }
        .coverage-list ul { list-style-type: none; padding: 0; margin: 0; }
        .coverage-list li { padding: 5px 0; font-size: 15px; color: #34495e; display: flex; align-items: center; }
        .coverage-list li::before { content: '✅'; margin-right: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ 旅平險動態報價模組 (內建離線完整版)</h1>
    
    <div id="status_message" class="status-bar">⏳ 正在連線載入遠端費率資料庫...</div>

    <div class="tab-container">
        <button id="btn_life" class="tab-btn active" onclick="switchTab('life')">南山人壽旅平險</button>
        <button id="btn_gen" class="tab-btn" onclick="switchTab('gen')">南山產物旅平險</button>
    </div>

    <!-- 南山人壽 Tab -->
    <div id="tab_life" class="tab-content active">
        <div class="form-row">
            <div class="form-group">
                <label>國內 / 海外</label>
                <select id="life_dest" onchange="updateLifeProducts()">
                    <!-- 預設為海外，以便顯示更多險種 -->
                    <option value="overseas" selected>海外</option>
                    <option value="domestic">國內</option>
                </select>
            </div>
            <div class="form-group">
                <label>年齡</label>
                <select id="life_age" onchange="updateLifeProducts()">
                    <option value="over_15" selected>滿 15 足歲</option>
                    <option value="under_15">未滿 15 足歲</option>
                </select>
            </div>
            <div class="form-group">
                <label>投保險種</label>
                <select id="life_product" onchange="updateLifeAmounts()"></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>投保保額</label>
                <select id="life_amount"></select>
            </div>
            <div class="form-group">
                <label>投保天數 (1~180天)</label>
                <input type="number" id="life_days" value="5" min="1" max="180">
            </div>
        </div>
        <button class="action-btn" id="calc_btn_life" onclick="calculateLife()" disabled>產出保額與保費</button>
    </div>

    <!-- 南山產物 Tab -->
    <div id="tab_gen" class="tab-content">
        <div class="form-row">
            <div class="form-group">
                <label>投保險種</label>
                <input type="text" value="金平安 PRO 6 專案" disabled>
            </div>
            <div class="form-group">
                <label>年齡</label>
                <select id="gen_age" onchange="updateGenPlans()">
                    <option value="over_15">滿 15 足歲 (包含15~85歲各計畫)</option>
                    <option value="under_15">未滿 15 足歲</option>
                </select>
            </div>
            <div class="form-group">
                <label>投保計畫</label>
                <select id="gen_plan"></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>投保天數 (1~180天)</label>
                <input type="number" id="gen_days" value="5" min="1" max="180">
            </div>
        </div>
        <button class="action-btn" id="calc_btn_gen" onclick="calculateGen()" disabled>產出保額與保費</button>
    </div>

    <!-- 結果區塊 -->
    <div id="resultBox" class="result-box">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
            <div style="flex: 1; min-width: 250px;">
                <div id="summaryTitle" style="font-size: 18px; color: #2c3e50; font-weight: bold; line-height: 1.4;"></div>
            </div>
            <div style="text-align: right; min-width: 150px;">
                <span style="font-size: 16px; color: #7f8c8d;">精確總保費：</span><br>
                <span class="highlight-premium" id="totalPremium">0</span> <span style="font-size: 18px; color: #2c3e50; font-weight: bold;">元</span>
            </div>
        </div>
        <div class="coverage-list">
            <h4>保障內容摘要：</h4>
            <ul id="coverageList"></ul>
        </div>
    </div>
</div>

    window.onload = function() {
        document.getElementById('status_message').innerText = "✅ 費率庫載入完成 (內建離線完整版)";
        document.getElementById('status_message').style.color = "#27ae60";
        document.getElementById('calc_btn_life').disabled = false;
        document.getElementById('calc_btn_gen').disabled = false;
        
        updateLifeProducts();
        updateGenPlans();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab_' + tabId).classList.add('active');
        document.getElementById('btn_' + tabId).classList.add('active');
        document.getElementById('resultBox').style.display = 'none';
        
        if(tabId === 'life') {
            updateLifeProducts();
        } else {
            updateGenPlans();
        }
    }

    function updateLifeProducts() {
        const isDomestic = document.getElementById('life_dest').value === 'domestic';
        const ageGroup = document.getElementById('life_age').value;
        const productSelect = document.getElementById('life_product');
        productSelect.innerHTML = '';

        let availableProducts = [];
        
        const allAgeProducts = ['sta', 'sta_smr', 'sta_smr_nsohs'];
        const over15Products = ['aota', 'aota_aat'];
        const under15Products = ['kmr', 'kmr_nsohs', 'akms', 'akms_aat'];

        if (isDomestic) {
            if (ageGroup === 'over_15') {
                availableProducts = ['sta', 'sta_smr'];
            } else {
                availableProducts = ['sta', 'sta_smr', 'kmr'];
            }
        } else {
            if (ageGroup === 'over_15') {
                availableProducts = [...allAgeProducts, ...over15Products];
            } else {
                availableProducts = [...allAgeProducts, ...under15Products];
            }
        }

        availableProducts.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p;
            opt.text = productNameMapping[p] || p;
            productSelect.appendChild(opt);
        });
        updateLifeAmounts();
    }

    function updateLifeAmounts() {
        const ageGroup = document.getElementById('life_age').value;
        const product = document.getElementById('life_product').value;
        const amountSelect = document.getElementById('life_amount');
        amountSelect.innerHTML = '';

        if (!product || !globalRatesDB[product]) {
            let opt = document.createElement('option');
            opt.value = "";
            opt.text = "尚無費率資料";
            amountSelect.appendChild(opt);
            return;
        }

        let targetData = globalRatesDB[product];
        
        // 如果這個險種有區分 over_15 / under_15，則進入下一層
        if (targetData['over_15'] !== undefined || targetData['under_15'] !== undefined) {
            targetData = targetData[ageGroup];
        }

        if (targetData && Object.keys(targetData).length > 0) {
            const amounts = Object.keys(targetData).map(Number).sort((a,b) => a-b);
            amounts.forEach(amt => {
                if (!isNaN(amt)) {
                    let opt = document.createElement('option');
                    opt.value = amt;
                    opt.text = amt + ' 萬';
                    // 根據常見保額自動預選
                    if (amt === 1000 || amt === 100 || amt === 20) opt.selected = true;
                    amountSelect.appendChild(opt);
                }
            });
        } else {
            let opt = document.createElement('option');
            opt.value = "";
            opt.text = "尚無費率資料";
            amountSelect.appendChild(opt);
        }
    }

    function updateGenPlans() {
        const ageGroup = document.getElementById('gen_age').value;
        const planSelect = document.getElementById('gen_plan');
        planSelect.innerHTML = '';

        // pro6 的資料結構在 JSON 中是用 adult 和 child 做 key
        const pro6Group = ageGroup === 'under_15' ? 'child' : 'adult';

        if (globalRatesDB['pro6'] && globalRatesDB['pro6'][pro6Group]) {
            const plans = Object.keys(globalRatesDB['pro6'][pro6Group]);
            if (plans.length > 0) {
                plans.forEach(plan => {
                    let opt = document.createElement('option');
                    opt.value = plan;
                    opt.text = pro6PlanNameMapping[plan] || plan;
                    planSelect.appendChild(opt);
                });
            } else {
                let opt = document.createElement('option');
                opt.value = "";
                opt.text = "該年齡層無計畫資料";
                planSelect.appendChild(opt);
            }
        } else {
            let opt = document.createElement('option');
            opt.value = "";
            opt.text = "無法載入 PRO6 計畫 (請確認 JSON 內有 pro6 結構)";
            planSelect.appendChild(opt);
        }
    }

    function renderResult(titleHtml, premium, coverageItems) {
        document.getElementById('summaryTitle').innerHTML = titleHtml;
        document.getElementById('totalPremium').innerText = premium.toLocaleString();
        
        const coverageUl = document.getElementById('coverageList');
        coverageUl.innerHTML = '';
        coverageItems.forEach(item => {
            let li = document.createElement('li');
            li.textContent = item;
            coverageUl.appendChild(li);
        });
        
        document.getElementById('resultBox').style.display = 'block';
    }

    
    function formatMoney(w) {
        if (w >= 1) return w.toLocaleString() + ' 萬';
        return Math.round(w * 10000).toLocaleString() + ' 元';
    }

    function getLifeCoverage(product, amount) {

        if (product.includes('sta')) {

        }
        
        if (product.includes('smr')) {
            list.push(`傷害醫療保險金 (實支實付): 限額 ${formatMoney(amt * 0.1)}`);

            list.push(`海外突發疾病返國住院醫療保險金: 限額 ${formatMoney(amt * 0.01)}`);

            list.push(`意外身故或喪葬費用保險金: ${formatMoney(amt)}`);
            list.push(`意外失能保險金: ${formatMoney(amt * 0.05)} ~ ${formatMoney(amt)}`);
            list.push(`航空大眾運輸意外身故保險金: ${formatMoney(amt * 0.25)}`);
            list.push(`航空大眾運輸意外失能保險金: ${formatMoney(amt * 0.25 * 0.05)} ~ ${formatMoney(amt * 0.25)}`);

    function calculateLife() {

        const product = document.getElementById('life_product').value;
        const productName = document.getElementById('life_product').options[document.getElementById('life_product').selectedIndex].text;
        const ageGroup = document.getElementById('life_age').value;
        const amount = document.getElementById('life_amount').value;
        const days = parseInt(document.getElementById('life_days').value);

        if (!amount) {
            alert('此選項目前無保額可供試算 (尚未建置費率)');
            return;
        }

        if (!days || days < 1 || days > 180) {
            alert('天數請輸入 1~180 之間');
            return;
        }

        try {
            let targetData = globalRatesDB[product];
            // 判斷是否需要依照年齡層進去抓資料 (STA, STA+SMR 等全年齡險種會跳過這個 if)
            if (targetData['over_15'] !== undefined || targetData['under_15'] !== undefined) {
                targetData = targetData[ageGroup];
            }
            
            const premium = targetData[amount][days];
            if (premium === undefined || premium === 0) {
                alert(`查無 ${days} 天的保費資料`);
                return;
            }
            const titleHtml = `南山人壽：${productName}<br><span style="font-size:14px; color:#7f8c8d;">保額 ${amount} 萬 | 行程 ${days} 天</span>`;
            renderResult(titleHtml, premium, getLifeCoverage(product, amount));
        } catch (e) {
            console.error(e);
            alert('無法計算保費，請確認該年齡與險種的費率表是否已齊全。');
        }
    }

    function calculateGen() {
        const ageGroup = document.getElementById('gen_age').value;
        const pro6Group = ageGroup === 'under_15' ? 'child' : 'adult';
        const plan = document.getElementById('gen_plan').value;
        const planName = document.getElementById('gen_plan').options[document.getElementById('gen_plan').selectedIndex]?.text || '';
        const days = parseInt(document.getElementById('gen_days').value);

        if (!plan) {
            alert('目前無可用計畫，請確認 JSON 資料。');
            return;
        }

        if (!days || days < 1 || days > 180) {
            alert('金平安PRO6 天數最高為 180 天');
            return;
        }

        try {
            const premium = globalRatesDB['pro6'][pro6Group][plan][days];
            if (premium === undefined || premium === 0) {
                alert(`查無 ${days} 天的保費資料`);
                return;
            }
            const titleHtml = `南山產物：金平安 PRO 6 專案<br><span style="font-size:14px; color:#7f8c8d;">${planName} | 行程 ${days} 天</span>`;
            renderResult(titleHtml, premium, coverageDetails['pro6'][plan] || []);
        } catch (e) {
            console.error(e);
            alert('無法計算保費，請確認選項。');
        }
    }
