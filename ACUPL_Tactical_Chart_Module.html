
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACUPL保障圖 - 動態視覺模組 V7</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 html2canvas 用於前端圖檔匯出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --color-death: #0ea5e9;
            --color-surrender: #10b981;
            --color-premium: #f43f5e;
            --color-cancer: #f59e0b;
            --bg-dark: #1e293b;
            --text-light: #f8fafc;
            --btn-blue: #3b82f6;
            --btn-hover: #2563eb;
            --btn-gray: #64748b;
            --btn-export: #8b5cf6;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 10px;
            color: #334155;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 96vh;
            position: relative;
        }
        .header {
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 10px;
            text-align: center;
            border-bottom: 3px solid var(--color-cancer);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        
        .btn-review {
            position: absolute;
            right: 15px;
            background-color: #eab308;
            color: #1e293b;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .btn-review:hover { background-color: #facc15; }
        
        .upload-zone {
            padding: 8px 20px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .btn-upload {
            background-color: var(--btn-blue);
            color: white; border: none; padding: 6px 12px; border-radius: 4px;
            font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-upload.img-btn { background-color: var(--btn-gray); }
        .file-upload-wrapper input[type=file] {
            font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }
        .upload-status { font-size: 0.85rem; color: #475569; font-weight: bold; flex-grow: 1; text-align: center; }
        
        .btn-export {
            background-color: var(--btn-export);
            color: white; border: none; padding: 6px 12px; border-radius: 4px;
            font-size: 0.9rem; font-weight: bold; cursor: pointer; display: none;
        }
        .btn-export:hover { background-color: #7c3aed; }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85); z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(2px);
        }
        .overlay-content { text-align: center; color: #334155; }
        
        /* 定義需要被截圖匯出的主體區域 */
        .main-content { 
            position: relative; display: flex; flex-direction: column; flex-grow: 1; 
            background: white; /* 確保截圖背景為白色 */
        }

        .controls-section { padding: 10px 20px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .slider-wrapper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .year-display { font-size: 1.1rem; font-weight: bold; color: #334155; width: 250px; }
        input[type=range] { flex-grow: 1; margin: 0 20px; cursor: pointer; }
        .multiplier-box-top {
            background: #f8fafc; border: 2px solid var(--color-death); padding: 5px 15px;
            border-radius: 8px; text-align: center; width: 120px;
        }
        .multiplier-box-top .label { font-size: 0.75rem; color: #475569; font-weight: bold; margin-bottom: 2px; }
        .multiplier-box-top .value { font-size: 1.5rem; font-weight: bold; color: var(--color-death); line-height: 1; }

        .dashboard { display: flex; justify-content: space-between; gap: 10px; }
        .metric-box { text-align: center; flex: 1; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .metric-title { font-size: 0.8rem; color: #64748b; font-weight: bold; margin-bottom: 4px; }
        .metric-value { font-size: 1.4rem; font-weight: bold; }
        
        .phase-indicator {
            display: flex; height: 28px; margin: 10px 20px 5px 20px; border-radius: 6px;
            overflow: hidden; font-weight: bold; text-align: center; line-height: 28px; font-size: 0.85rem; flex-shrink: 0;
        }
        .phase-1 { background-color: #fef08a; width: 33%; color: #854d0e; }
        .phase-2 { background-color: #0ea5e9; width: 67%; color: white; }
        
        .chart-wrapper { position: relative; padding: 0 20px 10px 20px; flex-grow: 1; min-height: 200px; width: 100%; box-sizing: border-box; }
        
        .export-footer {
            display: none; /* 平時隱藏，截圖時才顯示 */
            text-align: center; font-size: 0.75rem; color: #94a3b8; padding: 10px; border-top: 1px solid #f1f5f9;
        }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; display: none;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 800px;
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
        .modal-header h2 { margin: 0; font-size: 1.2rem; color: #1e293b; }
        .modal-body { overflow-y: auto; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 6px; border: 1px solid #cbd5e1; text-align: center; }
        th { background: #f1f5f9; position: sticky; top: 0; z-index: 1; }
        input[type=number] { width: 80px; padding: 4px; border: 1px solid #94a3b8; border-radius: 4px; text-align: right; }
        .modal-footer { text-align: right; border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 10px; }
        .btn-save { background: var(--color-surrender); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #94a3b8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 10px; }

        .format-usd::before { content: '$'; }
        .color-death { color: var(--color-death); }
        .color-surrender { color: var(--color-surrender); }
        .color-premium { color: var(--color-premium); }
        .color-cancer { color: var(--color-cancer); }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="headerTitle">
        <h1>🛡️ ACUPL保障圖</h1>
        <button class="btn-review" id="btnOpenReview">🔍 手動覆核</button>
    </div>
    
    <div class="upload-zone" data-html2canvas-ignore>
        <div class="file-upload-wrapper">
            <button class="btn-upload">📄 匯入 PDF</button>
            <input type="file" id="pdfUploader" accept=".pdf" />
        </div>
        <div class="file-upload-wrapper">
            <button class="btn-upload img-btn">🖼️ 解析截圖</button>
            <input type="file" id="imgUploader" accept="image/*" multiple />
        </div>
        <div class="upload-status" id="statusText">等待匯入資料...</div>
        <!-- 匯出按鈕 -->
        <button class="btn-export" id="btnExport">📷 匯出視覺圖檔</button>
    </div>

    <div class="main-content" id="captureArea">
        <div class="overlay" id="overlay">
            <div class="overlay-content">
                <h2>等待資料匯入...</h2>
                <p>支援官方 PDF 與 螢幕截圖 解析功能 (截圖可一次選取多張)</p>
            </div>
        </div>

        <div class="controls-section">
            <div class="slider-wrapper">
                <div class="year-display">
                    第 <span id="displayYear" style="color: var(--color-cancer); font-size: 1.4rem;">0</span> 保單年度 
                    (<span id="displayAge">0</span> 歲)
                </div>
                <!-- 匯出時隱藏滑桿，避免畫面雜亂 -->
                <input type="range" id="yearSlider" min="1" max="30" value="1" step="1" disabled>
                <div class="multiplier-box-top">
                    <div class="label">保障倍數</div>
                    <div class="value">約 <span id="valMultiplier">0.0</span> 倍</div>
                </div>
            </div>

            <div class="dashboard">
                <div class="metric-box" style="border-top: 3px solid var(--color-death);">
                    <div class="metric-title">年度末身故/完全失能</div>
                    <div class="metric-value color-death format-usd" id="valDeath">0</div>
                </div>
                <div class="metric-box" style="border-top: 3px solid var(--color-surrender);">
                    <div class="metric-title">年度末終止契約領取金</div>
                    <div class="metric-value color-surrender format-usd" id="valSurrender">0</div>
                </div>
                <div class="metric-box" style="border-top: 3px solid var(--color-premium);">
                    <div class="metric-title">累計應繳保險費</div>
                    <div class="metric-value color-premium format-usd" id="valPremium">0</div>
                </div>
                <div class="metric-box" style="border-top: 3px solid var(--color-cancer);">
                    <div class="metric-title">提前給付(重度癌症)</div>
                    <div class="metric-value color-cancer format-usd" id="valCancer">0</div>
                </div>
            </div>
        </div>
        
        <div class="phase-indicator">
            <div class="phase-1">責任重大期 (強化保障)</div>
            <div class="phase-2">退休享樂期 (持續累積資產)</div>
        </div>

        <div class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
        
        <!-- 匯出專用頁尾浮水印 -->
        <div class="export-footer" id="exportFooter">
            ※ 本圖表數據擷取自系統試算(宣告利率假設維持不變)，僅供戰術推演參考。實際保單價值與增值回饋分享金非保證給付，請依保險公司正式建議書與條款為準。
        </div>
    </div>
</div>

<div class="modal-backdrop" id="reviewModal" data-html2canvas-ignore>
    <div class="modal-content">
        <div class="modal-header">
            <h2>🔍 數據編輯與覆核</h2>
            <span style="font-size: 0.8rem; color: #64748b;">請確認或手動輸入以下數值</span>
        </div>
        <div class="modal-body">
            <table>
                <thead>
                    <tr>
                        <th>年度</th><th>年齡</th><th>累計保費</th><th>提前給付</th><th>身故給付</th><th>解約金</th>
                    </tr>
                </thead>
                <tbody id="reviewTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" id="btnCancelReview">取消</button>
            <button class="btn-save" id="btnSaveReview">💾 套用</button>
        </div>
    </div>
</div>

<script>
    let rawData = Array.from({length: 30}, (_, i) => ({
        year: i + 1, age: 0, premium: 0, cancer: 0, death: 0, surrender: 0
    }));
    
    // 模擬解析數據
    const simulatedData = [{"year": 1, "age": 48, "premium": 4623, "cancer": 0, "death": 11036, "surrender": 1116}, {"year": 2, "age": 49, "premium": 9246, "cancer": 20020, "death": 22168, "surrender": 4495}, {"year": 3, "age": 50, "premium": 13869, "cancer": 20077, "death": 32419, "surrender": 8020}, {"year": 4, "age": 51, "premium": 18492, "cancer": 20172, "death": 42683, "surrender": 11671}, {"year": 5, "age": 52, "premium": 23115, "cancer": 20296, "death": 53091, "surrender": 16432}, {"year": 6, "age": 53, "premium": 27738, "cancer": 20455, "death": 63814, "surrender": 23035}, {"year": 7, "age": 54, "premium": 32361, "cancer": 20652, "death": 74822, "surrender": 27867}, {"year": 8, "age": 55, "premium": 36984, "cancer": 20880, "death": 86169, "surrender": 35233}, {"year": 9, "age": 56, "premium": 41607, "cancer": 21144, "death": 97910, "surrender": 41552}, {"year": 10, "age": 57, "premium": 46230, "cancer": 21444, "death": 107939, "surrender": 47822}, {"year": 11, "age": 58, "premium": 46230, "cancer": 21772, "death": 108341, "surrender": 49307}, {"year": 12, "age": 59, "premium": 46230, "cancer": 22106, "death": 108745, "surrender": 50817}, {"year": 13, "age": 60, "premium": 46230, "cancer": 22445, "death": 109136, "surrender": 52327}, {"year": 14, "age": 61, "premium": 46230, "cancer": 22785, "death": 109526, "surrender": 53884}, {"year": 15, "age": 62, "premium": 46230, "cancer": 23136, "death": 109940, "surrender": 55489}, {"year": 16, "age": 63, "premium": 46230, "cancer": 23492, "death": 110350, "surrender": 57094}, {"year": 17, "age": 64, "premium": 46230, "cancer": 23854, "death": 110760, "surrender": 58735}, {"year": 18, "age": 65, "premium": 46230, "cancer": 24221, "death": 111179, "surrender": 60389}, {"year": 19, "age": 66, "premium": 46230, "cancer": 24593, "death": 111610, "surrender": 62079}, {"year": 20, "age": 67, "premium": 46230, "cancer": 24977, "death": 112049, "surrender": 63782}, {"year": 21, "age": 68, "premium": 46230, "cancer": 25366, "death": 112485, "surrender": 65508}, {"year": 22, "age": 69, "premium": 46230, "cancer": 25760, "death": 112916, "surrender": 67230}, {"year": 23, "age": 70, "premium": 46230, "cancer": 26160, "death": 113367, "surrender": 68948}, {"year": 24, "age": 71, "premium": 46230, "cancer": 26570, "death": 113823, "surrender": 70660}, {"year": 25, "age": 72, "premium": 46230, "cancer": 26985, "death": 114287, "surrender": 72406}, {"year": 26, "age": 73, "premium": 46230, "cancer": 27411, "death": 114754, "surrender": 74131}, {"year": 27, "age": 74, "premium": 46230, "cancer": 27843, "death": 115232, "surrender": 75877}, {"year": 28, "age": 75, "premium": 46230, "cancer": 28281, "death": 115705, "surrender": 77639}, {"year": 29, "age": 76, "premium": 46230, "cancer": 28729, "death": 116194, "surrender": 79407}, {"year": 30, "age": 77, "premium": 46230, "cancer": 29183, "death": 116677, "surrender": 81191}];

    let currentIndex = 0;
    let myChart = null;

    const slider = document.getElementById('yearSlider');
    const statusText = document.getElementById('statusText');
    const overlay = document.getElementById('overlay');
    const btnOpenReview = document.getElementById('btnOpenReview');
    const btnExport = document.getElementById('btnExport');
    const reviewModal = document.getElementById('reviewModal');
    const tbody = document.getElementById('reviewTableBody');
    const captureArea = document.getElementById('captureArea');
    const exportFooter = document.getElementById('exportFooter');
    const headerTitle = document.getElementById('headerTitle');

    const verticalLinePlugin = {
        id: 'verticalLine',
        afterDraw: (chart) => {
            const meta = chart.getDatasetMeta(0);
            if (meta.data && meta.data[currentIndex]) {
                const point = meta.data[currentIndex];
                const ctx = chart.ctx;
                
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(point.x, chart.scales.y.top);
                ctx.lineTo(point.x, chart.scales.y.bottom);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#d4af37'; 
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(point.x, chart.scales.y.bottom, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#d4af37';
                ctx.fill();
                ctx.restore();
            }
        }
    };

    function initChart() {
        const labels = rawData.map(d => `第${d.year}年`);
        if(myChart) myChart.destroy(); 

        const ctx = document.getElementById('myChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '年度末身故給付', data: rawData.map(d => d.death), borderColor: '#0ea5e9', backgroundColor: '#0ea5e9', borderWidth: 2, tension: 0.1, pointRadius: 3 },
                    { label: '解約領取金', data: rawData.map(d => d.surrender), borderColor: '#10b981', backgroundColor: '#10b981', borderWidth: 2, tension: 0.1, pointRadius: 3 },
                    { label: '提前給付(癌症)', data: rawData.map(d => d.cancer), borderColor: '#f59e0b', backgroundColor: '#f59e0b', borderWidth: 2, tension: 0.1, pointRadius: 3 },
                    { label: '累計保費', data: rawData.map(d => d.premium), borderColor: '#f43f5e', backgroundColor: '#f43f5e', borderWidth: 2, tension: 0.1, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 6, font: {size: 11} } } },
                scales: { y: { beginAtZero: true }, x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } } },
                animation: { duration: 0 } // 關閉動畫以利截圖瞬間渲染
            },
            plugins: [verticalLinePlugin]
        });
    }

    function updateDashboard(index) {
        currentIndex = parseInt(index);
        const row = rawData[currentIndex];
        
        document.getElementById('displayYear').innerText = row.year;
        document.getElementById('displayAge').innerText = row.age > 0 ? row.age : 0;
        document.getElementById('valDeath').innerText = row.death.toLocaleString();
        document.getElementById('valSurrender').innerText = row.surrender.toLocaleString();
        document.getElementById('valPremium').innerText = row.premium.toLocaleString();
        document.getElementById('valCancer').innerText = row.cancer.toLocaleString();
        
        const multiplier = row.premium > 0 ? (row.death / row.premium).toFixed(1) : "0.0";
        document.getElementById('valMultiplier').innerText = multiplier;
        if(myChart) myChart.update('none'); 
    }

    function simulateProcess(type, fileDesc) {
        statusText.innerHTML = `<span style="color: #475569;">🔄 正在進行 ${type} 解析...</span>`;
        setTimeout(() => {
            statusText.innerHTML = `<span style="color: #10b981;">✅ 解析完成</span>`;
            rawData = JSON.parse(JSON.stringify(simulatedData));
            
            overlay.style.display = 'none';
            btnOpenReview.style.display = 'block'; 
            btnExport.style.display = 'inline-block'; // 顯示匯出按鈕
            slider.disabled = false;
            initChart();
            updateDashboard(0);
        }, 1500);
    }

    document.getElementById('pdfUploader').addEventListener('change', (e) => {
        if(e.target.files.length > 0) simulateProcess('PDF', e.target.files[0].name);
    });
    
    document.getElementById('imgUploader').addEventListener('change', (e) => {
        if(e.target.files.length > 0) simulateProcess('OCR 影像', `${e.target.files.length} 張截圖`);
    });

    // --- HTML2Canvas 匯出圖檔邏輯 ---
    btnExport.addEventListener('click', () => {
        // 1. 準備截圖狀態：隱藏滑桿圓點、顯示免責聲明、將標題複製進截圖區
        slider.style.opacity = '0';
        exportFooter.style.display = 'block';
        
        // 將頂部標題暫時 clone 到 captureArea 內以供截圖
        const titleClone = headerTitle.cloneNode(true);
        titleClone.id = 'tempTitle';
        titleClone.querySelector('#btnOpenReview').remove(); // 移除截圖裡的覆核按鈕
        captureArea.insertBefore(titleClone, captureArea.firstChild);

        // 2. 執行截圖
        html2canvas(captureArea, {
            scale: 2, // 提高圖片解析度
            backgroundColor: '#ffffff',
            useCORS: true
        }).then(canvas => {
            // 3. 恢復原本 UI 狀態
            slider.style.opacity = '1';
            exportFooter.style.display = 'none';
            document.getElementById('tempTitle').remove();

            // 4. 觸發下載
            const link = document.createElement('a');
            const currentYear = rawData[currentIndex].year;
            link.download = `ACUPL保障戰術圖_第${currentYear}年.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    });

    btnOpenReview.addEventListener('click', () => {
        tbody.innerHTML = '';
        rawData.forEach((row, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.year}</td>
                <td><input type="number" id="edit_age_${i}" value="${row.age}" style="width: 50px;"></td>
                <td><input type="number" id="edit_prem_${i}" value="${row.premium}"></td>
                <td><input type="number" id="edit_canc_${i}" value="${row.cancer}"></td>
                <td><input type="number" id="edit_death_${i}" value="${row.death}"></td>
                <td><input type="number" id="edit_surr_${i}" value="${row.surrender}"></td>
            `;
            tbody.appendChild(tr);
        });
        reviewModal.style.display = 'flex';
    });

    document.getElementById('btnCancelReview').addEventListener('click', () => { reviewModal.style.display = 'none'; });

    document.getElementById('btnSaveReview').addEventListener('click', () => {
        rawData.forEach((row, i) => {
            row.age = parseInt(document.getElementById(`edit_age_${i}`).value) || 0;
            row.premium = parseInt(document.getElementById(`edit_prem_${i}`).value) || 0;
            row.cancer = parseInt(document.getElementById(`edit_canc_${i}`).value) || 0;
            row.death = parseInt(document.getElementById(`edit_death_${i}`).value) || 0;
            row.surrender = parseInt(document.getElementById(`edit_surr_${i}`).value) || 0;
        });
        reviewModal.style.display = 'none';
        initChart();
        updateDashboard(currentIndex);
    });

    slider.addEventListener('input', (e) => { updateDashboard(e.target.value - 1); });
    initChart();
</script>

</body>
</html>
